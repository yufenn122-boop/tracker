<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目进度表</title>
<link rel="manifest" href="/tracker/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="/tracker/icon-192.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { max-width: 100vw; overflow-x: hidden; }
  body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; }

  header {
    background: #1a1a2e;
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 200;
  }
  header h1 { font-size: 16px; font-weight: 600; flex: 1; min-width: 80px; }

  /* 搜索展开行 — 默认隐藏，点放大镜后显示 */
  .header-row2 {
    width: 100%;
    display: none;
    gap: 8px;
    align-items: center;
  }
  .header-row2.open { display: flex; }

  #search-toggle {
    background: none;
    border: none;
    color: rgba(255,255,255,0.8);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
  }
  #search-toggle:hover { background: rgba(255,255,255,0.1); }

  #search-input {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-family: inherit;
    min-width: 0;
  }
  #search-input::placeholder { color: rgba(255,255,255,0.5); }
  #search-input:focus { background: rgba(255,255,255,0.25); }
  #time-filter {
    border: none;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    background: rgba(255,255,255,0.15);
    color: white;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  #time-filter option { background: #1a1a2e; color: white; }
  .header-btn {
    background: #4f8ef7;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .header-btn:hover { background: #3a7de0; }
  #export-btn { background: #27ae60; }
  #export-btn:hover { background: #1e8449; }
  #today-btn {
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #today-btn:hover { background: #c0392b; }

  /* 超时提醒条 */
  #overdue-banner {
    display: none;
    background: #fff3cd;
    border-bottom: 1px solid #ffc107;
    padding: 8px 16px;
    font-size: 13px;
    color: #856404;
    cursor: pointer;
    user-select: none;
  }
  #overdue-banner:hover { background: #ffe69c; }

  /* 超时弹窗 */
  #overdue-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 300;
    align-items: center; justify-content: center;
  }
  #overdue-modal.show { display: flex; }
  #overdue-box {
    background: white; border-radius: 12px; padding: 20px;
    width: 340px; max-height: 75vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    display: flex; flex-direction: column; gap: 12px;
  }
  #overdue-box h2 { font-size: 15px; color: #1a1a2e; }
  .overdue-proj-name {
    font-size: 11px; font-weight: 600; color: #f97316;
    margin-bottom: 6px; text-transform: uppercase;
  }
  .overdue-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; background: #fff8f0;
    border-radius: 6px; margin-bottom: 4px;
  }
  .overdue-item-text { flex: 1; font-size: 13px; color: #333; }
  .overdue-item-age { font-size: 10px; color: #aaa; margin-top: 2px; }
  .overdue-done-btn {
    background: #27ae60; color: white; border: none;
    border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; flex-shrink: 0;
  }
  .overdue-del-btn {
    background: #e74c3c; color: white; border: none;
    border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; flex-shrink: 0;
  }

  @media (max-width: 600px) {
    #overdue-box { width: calc(100vw - 32px); }
  }

  /* ── Desktop: horizontal board ── */
  #board {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 20px 16px;
    overflow-x: auto;
    align-items: flex-start;
    max-width: 100vw;
    height: 0; /* forces flex child to respect max-height */
  }

  .column {
    background: white;
    border-radius: 10px;
    min-width: 210px;
    width: 210px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }

  .col-header {
    padding: 12px 14px;
    font-weight: 600;
    font-size: 14px;
    border-bottom: 2px solid #4f8ef7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f7f9ff;
    border-radius: 10px 10px 0 0;
    cursor: grab;
    user-select: none;
  }
  .col-header:active { cursor: grabbing; }
  .column.dragging { opacity: 0.4; }
  .column.drag-over { outline: 2px dashed #4f8ef7; outline-offset: 2px; }
  .col-header-left { display: flex; align-items: center; gap: 8px; }
  .col-header span.col-title { color: #1a1a2e; cursor: text; border-radius: 3px; padding: 1px 3px; }
  .col-header span.col-title:hover { background: rgba(79,142,247,0.1); }
  .col-header span.col-title[contenteditable="true"] { background: #fffbe6; box-shadow: 0 0 0 1px #f0c040; outline: none; cursor: text; }
  .col-count {
    background: #f97316;
    color: white;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .col-count.all-done {
    background: transparent;
    color: #27ae60;
    font-size: 13px;
    width: auto;
    height: auto;
    font-weight: 700;
    border-radius: 0;
  }
  .col-chevron { display: none; font-size: 12px; color: #aaa; transition: transform 0.2s; }
  .delete-col {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    line-height: 1;
  }
  .delete-col:hover { color: #e74c3c; }

  /* current progress preview — hidden on desktop */
  .col-preview { display: none; }

  .col-entries {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: #d0d7e3 transparent;
  }
  .col-entries::-webkit-scrollbar { width: 4px; }
  .col-entries::-webkit-scrollbar-track { background: transparent; }
  .col-entries::-webkit-scrollbar-thumb { background: #d0d7e3; border-radius: 2px; }
  .col-entries::-webkit-scrollbar-thumb:hover { background: #aab4c8; }

  /* Entry */
  .entry {
    border-radius: 6px;
    padding: 8px 10px 8px 10px;
    font-size: 13px;
    color: #333;
    position: relative;
    border: none;
    transition: background 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .entry.todo { background: #fff3e0; }
  .entry.done { background: #f0fff4; }
  .entry.done .entry-text { text-decoration: line-through; color: #999; }

  .status-btn {
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.15);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    white-space: nowrap;
    transition: opacity 0.2s;
    margin-top: 1px;
  }
  .entry.todo .status-btn { background: #f97316; color: white; }
  .entry.done .status-btn { background: #27ae60; color: white; }

  .entry-body { flex: 1; min-width: 0; }
  .entry-text { word-break: break-all; outline: none; min-height: 1em; }
  .entry-text[contenteditable="true"] {
    background: #fffbe6;
    border-radius: 3px;
    padding: 1px 3px;
    box-shadow: 0 0 0 1px #f0c040;
  }
  .entry .entry-time { font-size: 10px; color: #aaa; margin-top: 4px; }
  .entry-actions { display: none; gap: 4px; flex-shrink: 0; align-self: flex-start; margin-top: 1px; }
  .entry:hover .entry-actions { display: flex; }
  .entry-actions button {
    background: none; border: none; cursor: pointer;
    font-size: 15px; color: #bbb; padding: 2px 5px; border-radius: 3px;
  }
  .entry-actions .edit-btn:hover { color: #4f8ef7; background: #eef3ff; }
  .entry-actions .delete-entry:hover { color: #e74c3c; background: #fff0f0; }

  .empty-hint { color: #ccc; font-size: 12px; text-align: center; padding: 20px 0; }
  .all-done-hint { color: #27ae60; font-size: 13px; text-align: center; padding: 10px 0 4px; font-weight: 600; }

  /* 内联新增输入框 */
  .col-add-row {
    display: none;
    padding: 6px 10px 8px;
    gap: 6px;
    align-items: center;
    border-top: 1px solid #f0f2f5;
  }
  .col-add-row.show { display: flex; }
  .col-add-input {
    flex: 1;
    border: 1px solid #d0d7e3;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  .col-add-input:focus { border-color: #4f8ef7; }
  .col-add-confirm {
    background: #4f8ef7; color: white; border: none;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  .col-add-confirm:hover { background: #3a7de0; }
  .col-add-cancel {
    background: none; border: none; color: #aaa; cursor: pointer;
    font-size: 16px; padding: 2px 6px; flex-shrink: 0;
  }
  .col-add-cancel:hover { color: #e74c3c; }

  /* 自定义项目下拉 */
  .proj-dropdown { position: relative; flex-shrink: 0; width: 90px; }
  .proj-selected {
    border: 1px solid #d0d7e3; border-radius: 8px;
    padding: 8px 8px; font-size: 13px; background: white;
    color: #333; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; user-select: none;
  }
  .proj-selected:focus, .proj-dropdown.open .proj-selected { border-color: #4f8ef7; }
  .proj-menu {
    position: absolute; bottom: calc(100% + 4px); left: 0;
    width: 130px; background: white;
    border: 1px solid #d0d7e3; border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    z-index: 500; overflow: hidden;
  }
  .proj-opt-new {
    padding: 9px 12px; font-size: 13px; font-weight: 600;
    color: #4f8ef7; background: #f0f6ff;
    cursor: pointer; border-bottom: 1px solid #e8eef8;
  }
  .proj-opt-new:hover { background: #e0ecff; }
  .proj-opt-list { max-height: 180px; overflow-y: auto; }
  .proj-opt {
    padding: 8px 12px; font-size: 13px; color: #333;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .proj-opt:hover { background: #f0f2f5; }
  .proj-opt.selected { color: #4f8ef7; font-weight: 600; }

  #entry-input {
    flex: 1;
    border: 1px solid #d0d7e3;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  #entry-input:focus { border-color: #4f8ef7; }

  #submit-btn {
    background: #4f8ef7;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #submit-btn:hover { background: #3a7de0; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white; border-radius: 12px; padding: 24px;
    width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; color: #1a1a2e; }
  .modal input {
    width: 100%; border: 1px solid #d0d7e3; border-radius: 8px;
    padding: 9px 12px; font-size: 14px; outline: none; margin-bottom: 14px;
  }
  .modal input:focus { border-color: #4f8ef7; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btns button { padding: 7px 18px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; }
  .btn-cancel { background: #f0f2f5; color: #666; }
  .btn-confirm { background: #4f8ef7; color: white; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    #board {
      flex-direction: column;
      overflow-x: hidden;
      padding: 12px;
      gap: 10px;
    }

    .column {
      width: 100%;
      min-width: unset;
      max-height: none;
      overflow: hidden;
    }

    /* collapsed by default on mobile */
    .column .col-entries { display: none; }
    .column.open .col-entries { display: flex; max-height: 40vh; overflow-y: auto; }

    .col-header { cursor: pointer; border-radius: 10px; border-bottom: none; }
    .column.open .col-header { border-radius: 10px 10px 0 0; border-bottom: 2px solid #4f8ef7; }

    .col-chevron { display: inline-block; }
    .column.open .col-chevron { transform: rotate(180deg); }

    /* current progress preview */
    .col-preview {
      display: block;
      padding: 6px 14px 10px;
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: white;
      border-radius: 0 0 10px 10px;
    }
    .column.open .col-preview { display: none; }
    .col-preview .preview-label {
      display: inline-block;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      margin-right: 6px;
      vertical-align: middle;
      color: white;
    }
    .preview-label.todo { background: #f97316; }
    .preview-label.done { background: #27ae60; }
    .preview-label.empty { display: none; }
    .col-preview .preview-text {
      vertical-align: middle;
    }

    /* show entry-actions on mobile via tap */
    .entry:hover .entry-actions { display: none; }
    .entry.tapped .entry-actions { display: flex; align-self: flex-start; }
  }
  /* Date picker modal */
  #date-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 200;
    align-items: center; justify-content: center;
  }
  #date-modal.show { display: flex; }
  #date-box {
    background: white; border-radius: 12px; padding: 24px;
    width: 280px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    display: flex; flex-direction: column; gap: 12px;
  }
  #date-box h2 { font-size: 15px; color: #1a1a2e; }
  #date-box label { font-size: 13px; color: #555; display: flex; flex-direction: column; gap: 4px; }
  #date-box input[type=date] {
    border: 1px solid #d0d7e3; border-radius: 7px;
    padding: 7px 10px; font-size: 13px; outline: none; font-family: inherit;
  }
  #date-box input[type=date]:focus { border-color: #4f8ef7; }
  .date-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .date-btns button { padding: 7px 16px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; }

  /* Filter badge */
  #filter-badge {
    display: none;
    background: #f97316;
    color: white;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #filter-badge.show { display: inline-block; }
  #auth-overlay {
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #auth-box {
    background: white;
    border-radius: 14px;
    padding: 32px 28px;
    width: 300px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #auth-box h2 { font-size: 17px; color: #1a1a2e; text-align: center; }
  #auth-input {
    border: 1px solid #d0d7e3;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    width: 100%;
  }
  #auth-input:focus { border-color: #4f8ef7; }
  #auth-error { color: #e74c3c; font-size: 13px; text-align: center; min-height: 18px; }
  #auth-btn {
    background: #4f8ef7;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  #auth-btn:hover { background: #3a7de0; }

  /* ── Calendar View ── */
  #calendar-view {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    flex-direction: column;
    gap: 16px;
  }
  #calendar-view.active { display: flex; }
  #board.hidden { display: none; }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a2e;
  }
  .cal-nav button {
    background: none;
    border: 1px solid #d0d7e3;
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 14px;
    color: #555;
  }
  .cal-nav button:hover { background: #f0f2f5; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day-header {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: #aaa;
    padding: 4px 0;
  }
  .cal-cell {
    background: white;
    border-radius: 8px;
    min-height: 68px;
    padding: 6px;
    cursor: default;
    border: 1px solid #f0f2f5;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cal-cell.has-done { cursor: pointer; }
  .cal-cell.has-done:hover { border-color: #4f8ef7; background: #f7f9ff; }
  .cal-cell.today { border-color: #4f8ef7; }
  .cal-cell.selected { border-color: #4f8ef7; background: #f0f6ff; }
  .cal-cell.other-month { background: #fafafa; }
  .cal-cell.other-month .cal-date { color: #ccc; }
  .cal-date {
    font-size: 12px;
    font-weight: 600;
    color: #333;
  }
  .cal-date.today-num {
    background: #4f8ef7;
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .cal-done-count {
    font-size: 12px;
    color: #27ae60;
    font-weight: 700;
    background: #e6f9ee;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: flex-start;
  }

  /* Frequency chart */
  .freq-section {
    background: white;
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .freq-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .freq-title {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a2e;
  }
  .freq-range-toggle {
    border: 1px solid #d0d7e3;
    background: white;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    color: #555;
  }
  .freq-range-toggle:hover { background: #f0f2f5; }
  .freq-tabs {
    display: none;
  }
  .freq-tab {
    border: 1px solid #d0d7e3;
    background: white;
    border-radius: 6px;
    padding: 3px 12px;
    font-size: 12px;
    cursor: pointer;
    color: #555;
  }
  .freq-tab.active { background: #4f8ef7; color: white; border-color: #4f8ef7; }
  #freq-chart-area { width: 100%; overflow-x: auto; }

  /* Day inline info panel */
  #day-info-panel {
    background: white; border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: none;
  }
  #day-info-panel.show { display: block; }
  #day-info-title {
    font-size: 13px; font-weight: 600; color: #1a1a2e; margin-bottom: 10px;
  }

<script>
const SUPABASE_URL = 'https://rokrwejqxrpswpkzhawx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OpTUNdpvmVR93h-i6XB3pQ_TrWR8ikx';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const AUTH_EMAIL = '2777641741@qq.com';

// Auth
(function() {
  const overlay = document.getElementById('auth-overlay');
  const input = document.getElementById('auth-input');

  const error = document.getElementById('auth-error');

  overlay.style.display = 'flex';

  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  setTimeout(() => input.focus(), 100);
})();

const DEFAULTS = ['家教', '督学群', '单片机', '自媒体', '雪花酥'];
let state = { projects: [], entries: {} };
const openCols = new Set();
let lastAutoOpenedCol = null; // ⑥ 记录最近自动展开的列

// ④ 垃圾桶：存已删除的项目/任务，仅内存，刷新后清空
const trash = []; // { type:'entry'|'project', proj, entry?, entries?, ts }

// ② 通知：存已生成的报告通知
let notifications = [];
function loadNotifications() {
  try { notifications = JSON.parse(localStorage.getItem('report_notifs') || '[]'); } catch { notifications = []; }
}
function saveNotifications() {
  localStorage.setItem('report_notifs', JSON.stringify(notifications));
}

// ③ 报告开关
function isReportEnabled() {
  return localStorage.getItem('report_enabled') !== 'false';
}
function setReportEnabled(val) {
  localStorage.setItem('report_enabled', val ? 'true' : 'false');
}

// Project order persistence
function saveOrder() {
  localStorage.setItem('proj_order', JSON.stringify(state.projects));
}
function loadOrder() {
  try { return JSON.parse(localStorage.getItem('proj_order')) || []; } catch { return []; }
}

// Filter state
let filterKeyword = '';
let filterRange = { type: 'all', start: null, end: null };

function getFilteredEntries(entries) {
  return entries.filter(e => {
    // keyword
    if (filterKeyword && !e.text.toLowerCase().includes(filterKeyword.toLowerCase())) return false;
    // time
    if (filterRange.type === 'today') {
      const d = new Date(e.ts), now = new Date();
      if (d.toDateString() !== now.toDateString()) return false;
    } else if (filterRange.type === 'week') {
      const now = new Date(), day = now.getDay() || 7;
      const weekStart = new Date(now); weekStart.setHours(0,0,0,0); weekStart.setDate(now.getDate() - day + 1);
      if (e.ts < weekStart.getTime()) return false;
    } else if (filterRange.type === 'month') {
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      if (e.ts < monthStart.getTime()) return false;
    } else if (filterRange.type === 'custom' && filterRange.start && filterRange.end) {
      if (e.ts < filterRange.start || e.ts > filterRange.end) return false;
    }
    return true;
  });
}

function formatTime(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}


async function loadFromDB() {
  const { data, error } = await sb.from('entries').select('*').order('ts', { ascending: true });
  if (error) { console.error(error); return; }

  const projects = new Set(DEFAULTS);
  const entries = {};
  DEFAULTS.forEach(p => entries[p] = []);

  data.forEach(row => {
    if (!projects.has(row.project)) {
      projects.add(row.project);
      entries[row.project] = [];
    }
    entries[row.project].push({ id: row.id, text: row.text, status: row.status, ts: row.ts, origTs: row.orig_ts || row.ts });
  });

  state.projects = Array.from(projects).filter(p => !p.startsWith('__report_'));

  // Apply saved order
  const savedOrder = loadOrder();
  if (savedOrder.length) {
    const ordered = savedOrder.filter(p => state.projects.includes(p));
    const rest = state.projects.filter(p => !ordered.includes(p));
    state.projects = [...ordered, ...rest];
  }

  state.entries = entries;
  render();
  loadNotifications();
  renderNotifDot();
  startAutoReportScheduler();
}

function render() {
  const board = document.getElementById('board');
  const prevSelected = window._selectedProj || state.projects[0] || '';

  // ⑥ 保存各列滚动位置，render 后恢复
  const savedScrolls = {};
  document.querySelectorAll('.col-entries').forEach(el => {
    const id = el.id; // col-{proj}
    if (el.scrollTop > 0) savedScrolls[id] = el.scrollTop;
  });

  board.innerHTML = '';

  const isMobile = window.innerWidth <= 600;
  const isFiltering = filterKeyword || filterRange.type !== 'all';
  const now = Date.now();
  const OVERDUE_MS = 7 * 24 * 60 * 60 * 1000;
  const todayStr = new Date().toDateString();

  // update badge
  const badge = document.getElementById('filter-badge');
  badge.classList.toggle('show', isFiltering);

  // 超时提醒条 + 按钮
  const overdueBanner = document.getElementById('overdue-banner');
  const overdueBtn = document.getElementById('overdue-btn');
  let totalOverdue = 0;
  state.projects.forEach(proj => {
    (state.entries[proj] || []).forEach(e => {
      if (e.status === 'todo' && (now - (e.origTs || e.ts)) > OVERDUE_MS) totalOverdue++;
    });
  });
  if (totalOverdue > 0) {
    overdueBanner.textContent = `⚠️ 当前存在 ${totalOverdue} 条超时任务，点击查看`;
    overdueBanner.style.display = 'block';
    overdueBtn.style.display = '';
    overdueBtn.textContent = `⏰ 超时 ${totalOverdue}`;
  } else {
    overdueBanner.style.display = 'none';
    overdueBtn.style.display = 'none';
  }

  state.projects.forEach(proj => {
    const allEntries = state.entries[proj] || [];

    // 看板只显示：未超时的 todo + 今日完成的 done
    const visibleEntries = allEntries.filter(e => {
      if (e.status === 'todo') return (now - (e.origTs || e.ts)) <= OVERDUE_MS;
      if (e.status === 'done') return new Date(e.ts).toDateString() === todayStr;
      return false;
    });

    const entries = isFiltering ? getFilteredEntries(visibleEntries) : visibleEntries;
    const latest = allEntries[allEntries.length - 1];

    // hide column if filtering and no results
    if (isFiltering && entries.length === 0) {
      const opt = document.createElement('option');
      opt.value = proj; opt.textContent = proj;
      select.appendChild(opt);
      return;
    }

    const col = document.createElement('div');
    col.className = 'column' + (openCols.has(proj) ? ' open' : '');

    // 徽章只计未超时的 todo
    const todoCount = allEntries.filter(e => e.status === 'todo' && (now - (e.origTs || e.ts)) <= OVERDUE_MS).length;
    // allDone：有可见内容（今日done或未超时todo）且没有待办
    const hasVisible = visibleEntries.length > 0;
    const allDone = hasVisible && todoCount === 0;
    const countLabel = !hasVisible ? '' : allDone ? '全部完成！🎉' : String(todoCount);

    const entriesHtml = entries.length === 0
      ? '<div class="empty-hint">暂无记录</div>'
      : entries.map((e) => `
          <div class="entry ${e.status}" data-id="${e.id}" data-proj="${proj}" data-idx="${allEntries.indexOf(e)}">
            <button class="status-btn" data-id="${e.id}" data-proj="${proj}" data-idx="${allEntries.indexOf(e)}">${e.status === 'todo' ? '待办' : '完成'}</button>
            <div class="entry-body">
              <div class="entry-text">${e.text}</div>
              <div class="entry-time">${formatTime(e.ts)}</div>
            </div>
            <div class="entry-actions">
              <button class="delete-entry" data-id="${e.id}" data-proj="${proj}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
            </div>
          </div>`).join('');

    // Preview: prioritize earliest todo, fallback to today's done; if nothing visible, show empty
    const firstTodo = visibleEntries.find(e => e.status === 'todo');
    const todayDone = visibleEntries.filter(e => e.status === 'done');
    const previewEntry = firstTodo || todayDone[todayDone.length - 1] || null;
    const previewHtml = previewEntry
      ? `<span class="preview-label ${previewEntry.status}">${previewEntry.status === 'todo' ? '当前进度' : '已完成'}</span><span class="preview-text">${previewEntry.text}</span>`
      : '暂无记录';

    col.innerHTML = `
      <div class="col-header">
        <div class="col-header-left">
          <span class="col-chevron">▼</span>
          <span class="col-title">${proj}</span>
          ${countLabel ? `<span class="col-count">${countLabel}</span>` : ''}
        </div>
        <button class="delete-col" data-proj="${proj}">×</button>
      </div>
      <div class="col-preview">${previewHtml}</div>
      <div class="col-entries" id="col-${proj}">${entriesHtml}</div>
      <div class="col-add-row" id="add-row-${proj}">
        <input class="col-add-input" type="text" placeholder="输入任务内容..." />
        <button class="col-add-confirm">✓</button>
        <button class="col-add-cancel">×</button>
      </div>
    `;
    // 全部完成时给 badge 加样式
    const countBadge = col.querySelector('.col-count');
    if (allDone) countBadge.classList.add('all-done');
    board.appendChild(col);

    // Drag and drop
    const header = col.querySelector('.col-header');
    col.draggable = true;
    col.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', proj);
      setTimeout(() => col.classList.add('dragging'), 0);
    });
    col.addEventListener('dragend', () => {
      col.classList.remove('dragging');
      document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
    });
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const fromProj = e.dataTransfer.getData('text/plain');
      const toProj = proj;
      if (fromProj === toProj) return;
      const fromIdx = state.projects.indexOf(fromProj);
      const toIdx = state.projects.indexOf(toProj);
      state.projects.splice(fromIdx, 1);
      state.projects.splice(toIdx, 0, fromProj);
      saveOrder();
      render();
    });

    // Mobile long-press drag (touch)
    let touchDragProj = null, longPressTimer = null;
    header.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('delete-col')) return;
      longPressTimer = setTimeout(() => {
        touchDragProj = proj;
        col.classList.add('dragging');
        navigator.vibrate && navigator.vibrate(40);
      }, 500);
    }, { passive: true });
    header.addEventListener('touchend', () => {
      clearTimeout(longPressTimer);
      if (touchDragProj) {
        col.classList.remove('dragging');
        touchDragProj = null;
      }
    });
    header.addEventListener('touchmove', (e) => {
      if (!touchDragProj) return;
      e.preventDefault();
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetCol = el && el.closest('.column');
      document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
      if (targetCol && targetCol !== col) {
        targetCol.classList.add('drag-over');
        const toProj = targetCol.querySelector('.col-title').textContent;
        const fromIdx = state.projects.indexOf(touchDragProj);
        const toIdx = state.projects.indexOf(toProj);
        if (fromIdx !== toIdx) {
          state.projects.splice(fromIdx, 1);
          state.projects.splice(toIdx, 0, touchDragProj);
          saveOrder();
          render();
        }
      }
    }, { passive: false });

    if (!isMobile || openCols.has(proj)) {
      const colEntries = col.querySelector('.col-entries');
      const savedPos = savedScrolls[`col-${proj}`];
      if (savedPos !== undefined) {
        // 恢复之前的滚动位置
        requestAnimationFrame(() => { colEntries.scrollTop = savedPos; });
      }
      // 若没有保存位置，保持默认（顶部），不强制 scrollTop = 0
    }
  });

  // 双击列头（非 col-title）→ 展开内联新增输入框
  document.querySelectorAll('.col-header').forEach(header => {
    header.addEventListener('dblclick', (e) => {
      if (e.target.classList.contains('col-title') || e.target.closest('.col-title')) return;
      if (e.target.classList.contains('delete-col')) return;
      const col = header.closest('.column');
      const proj = col.querySelector('.col-title').textContent;
      const addRow = col.querySelector('.col-add-row');
      if (!addRow) return;
      addRow.classList.add('show');
      const input = addRow.querySelector('.col-add-input');
      input.focus();
    });
  });

  // 内联新增输入框事件
  document.querySelectorAll('.col-add-row').forEach(addRow => {
    const col = addRow.closest('.column');
    const proj = col.querySelector('.col-title').textContent;
    const input = addRow.querySelector('.col-add-input');
    const confirmBtn = addRow.querySelector('.col-add-confirm');
    const cancelBtn = addRow.querySelector('.col-add-cancel');

    async function submitAdd() {
      const text = input.value.trim();
      if (!text) { addRow.classList.remove('show'); input.value = ''; return; }
      addRow.classList.remove('show');
      input.value = '';
      const ts = Date.now();
      const tempId = 'temp_' + ts;
      if (!state.entries[proj]) state.entries[proj] = [];
      state.entries[proj].push({ id: tempId, text, status: 'todo', ts, origTs: ts });
      openCols.add(proj);
      render();
      const colEl = document.getElementById(`col-${proj}`);
      if (colEl) colEl.scrollTop = colEl.scrollHeight;
      const { data, error } = await sb.from('entries').insert({ project: proj, text, status: 'todo', ts, orig_ts: ts }).select().single();
      if (error) {
        state.entries[proj] = state.entries[proj].filter(e => e.id !== tempId);
        render();
      } else {
        const entry = state.entries[proj].find(e => e.id === tempId);
        if (entry) entry.id = data.id;
      }
    }

    confirmBtn.addEventListener('click', submitAdd);
    cancelBtn.addEventListener('click', () => { addRow.classList.remove('show'); input.value = ''; });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitAdd();
      if (e.key === 'Escape') { addRow.classList.remove('show'); input.value = ''; }
    });
  });

  // Project name inline edit — 双击触发
  document.querySelectorAll('.col-title').forEach(titleEl => {
    titleEl.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      if (titleEl.contentEditable === 'true') return;
      const oldName = titleEl.textContent;
      titleEl.contentEditable = 'true';
      titleEl.focus();
      // select all
      const range = document.createRange();
      range.selectNodeContents(titleEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      async function saveRename() {
        titleEl.contentEditable = 'false';
        const newName = titleEl.textContent.trim();
        if (!newName || newName === oldName) { titleEl.textContent = oldName; return; }
        if (state.projects.includes(newName)) { titleEl.textContent = oldName; return; }
        // update state
        const idx = state.projects.indexOf(oldName);
        if (idx === -1) return;
        state.projects[idx] = newName;
        state.entries[newName] = state.entries[oldName];
        delete state.entries[oldName];
        if (openCols.has(oldName)) { openCols.delete(oldName); openCols.add(newName); }
        saveOrder();
        render();
        // update DB
        await sb.from('entries').update({ project: newName }).eq('project', oldName);
      }

      titleEl.addEventListener('blur', saveRename, { once: true });
      titleEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
        if (e.key === 'Escape') {
          titleEl.contentEditable = 'false';
          titleEl.textContent = oldName;
          titleEl.removeEventListener('blur', saveRename);
        }
      }, { once: true });
    });
  });

  // Mobile: toggle open/close on header click
  document.querySelectorAll('.col-header').forEach(header => {
    header.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-col')) return;
      if (e.target.classList.contains('col-title')) return;
      if (!window.matchMedia('(max-width: 600px)').matches) return;
      const col = header.closest('.column');
      const proj = col.querySelector('.col-title').textContent;
      const topBefore = col.getBoundingClientRect().top;
      const wasOpen = openCols.has(proj);

      // 点击项目条时更新 _selectedProj
      window._selectedProj = proj;
      renderProjDropdown(proj);

      if (!wasOpen) {
        // 展开：若有上一个自动展开的列且用户未手动折叠过，自动折叠它
        if (lastAutoOpenedCol && lastAutoOpenedCol !== proj && openCols.has(lastAutoOpenedCol)) {
          openCols.delete(lastAutoOpenedCol);
        }
        openCols.add(proj);
        lastAutoOpenedCol = proj;
      } else {
        openCols.delete(proj);
        if (lastAutoOpenedCol === proj) lastAutoOpenedCol = null;
      }

      render();
      const newCol = [...document.querySelectorAll('.col-title')]
        .find(el => el.textContent === proj)?.closest('.column');
      if (newCol) {
        if (!wasOpen) {
          const topAfter = newCol.getBoundingClientRect().top;
          window.scrollBy({ top: topAfter - topBefore, behavior: 'instant' });
          const rect = newCol.getBoundingClientRect();
          if (rect.bottom > window.innerHeight) {
            const headerH = document.querySelector('header').offsetHeight;
            window.scrollBy({ top: rect.top - headerH - 8, behavior: 'smooth' });
          }
        } else {
          const topAfter = newCol.getBoundingClientRect().top;
          window.scrollBy({ top: topAfter - topBefore, behavior: 'instant' });
        }
      }
    });
  });

  // Mobile: tap entry to show actions
  document.querySelectorAll('.entry').forEach(entry => {
    entry.addEventListener('click', (e) => {
      if (!window.matchMedia('(max-width: 600px)').matches) return;
      if (e.target.closest('.entry-actions') || e.target.classList.contains('status-btn')) return;
      document.querySelectorAll('.entry.tapped').forEach(el => el.classList.remove('tapped'));
      entry.classList.toggle('tapped');
    });
  });

  // Delete column — 放入垃圾桶
  document.querySelectorAll('.delete-col').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const proj = btn.dataset.proj;
      if (!confirm(`删除项目「${proj}」？可在回收站撤回。`)) return;
      const savedEntries = (state.entries[proj] || []).map(e => ({ ...e }));
      // 放入垃圾桶
      trash.unshift({ type: 'project', proj, entries: savedEntries, ts: Date.now() });
      if (trash.length > 50) trash.pop();
      // Optimistic update
      state.projects = state.projects.filter(p => p !== proj);
      delete state.entries[proj];
      openCols.delete(proj);
      render();
      // 真正删除 DB（垃圾桶里保留数据，撤回时重新 insert）
      await sb.from('entries').delete().eq('project', proj);
    });
  });

  // Toggle status
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { id, proj, idx } = btn.dataset;
      const entry = state.entries[proj][Number(idx)];
      const oldStatus = entry.status;
      const newStatus = oldStatus === 'todo' ? 'done' : 'todo';
      const newTs = newStatus === 'done' ? Date.now() : entry.origTs;
      const oldTs = entry.ts;
      // Optimistic update — preserve scroll position
      entry.status = newStatus;
      entry.ts = newTs;
      const savedY = window.scrollY;
      render();
      window.scrollTo({ top: savedY, behavior: 'instant' });
      // 若 id 还是临时值，等它变成真实 id 再发请求
      let realId = entry.id;
      if (String(realId).startsWith('temp_')) {
        await new Promise(resolve => {
          const t = setInterval(() => {
            if (!String(entry.id).startsWith('temp_')) { clearInterval(t); resolve(); }
          }, 50);
          setTimeout(() => { clearInterval(t); resolve(); }, 5000);
        });
        realId = entry.id;
      }
      if (String(realId).startsWith('temp_')) return; // insert 失败，放弃
      const { error } = await sb.from('entries').update({ status: newStatus, ts: newTs }).eq('id', realId);
      if (error) {
        entry.status = oldStatus; entry.ts = oldTs;
        const savedY2 = window.scrollY;
        render();
        window.scrollTo({ top: savedY2, behavior: 'instant' });
      }
    });
  });

  // Edit entry — 双击文本区域触发
  document.querySelectorAll('.entry-text').forEach(textEl => {
    textEl.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      const entryEl = textEl.closest('.entry');
      const { id, proj, idx } = entryEl.dataset;
      if (textEl.contentEditable === 'true') return;

      textEl.contentEditable = 'true';
      textEl.focus();
      const range = document.createRange();
      range.selectNodeContents(textEl);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      let saved = false;
      async function saveEdit() {
        if (saved) return;
        saved = true;
        const newText = textEl.innerText.trim();
        textEl.contentEditable = 'false';
        if (newText && newText !== state.entries[proj][Number(idx)].text) {
          const oldText = state.entries[proj][Number(idx)].text;
          state.entries[proj][Number(idx)].text = newText;
          render();
          const { error } = await sb.from('entries').update({ text: newText }).eq('id', id);
          if (error) { state.entries[proj][Number(idx)].text = oldText; render(); }
        } else {
          render();
        }
      }

      textEl.addEventListener('blur', saveEdit, { once: true });
      textEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); }
        if (e.key === 'Escape') {
          saved = true;
          textEl.contentEditable = 'false';
          textEl.removeEventListener('blur', saveEdit);
          render();
        }
      }, { once: true });
    });
  });

  // Delete entry — 放入垃圾桶
  document.querySelectorAll('.delete-entry').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { id, proj } = btn.dataset;
      const entry = state.entries[proj]?.find(e => e.id == id);
      if (!entry) return;
      // 放入垃圾桶
      trash.unshift({ type: 'entry', proj, entry: { ...entry }, ts: Date.now() });
      if (trash.length > 50) trash.pop();
      // Optimistic update
      state.entries[proj] = state.entries[proj].filter(e => e.id != id);
      render();
      await sb.from('entries').delete().eq('id', id);
    });
  });
}

function renderOverdueModal() {
  const OVERDUE_MS = 7 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  const content = document.getElementById('overdue-content');
  content.innerHTML = '';

  state.projects.forEach(proj => {
    const overdueItems = (state.entries[proj] || []).filter(
      e => e.status === 'todo' && (now - (e.origTs || e.ts)) > OVERDUE_MS
    );
    if (!overdueItems.length) return;

    const group = document.createElement('div');
    group.style.marginBottom = '12px';
    const title = document.createElement('div');
    title.className = 'overdue-proj-name';
    title.textContent = proj;
    group.appendChild(title);

    overdueItems.forEach(e => {
      const ageDays = Math.floor((now - (e.origTs || e.ts)) / 86400000);
      const item = document.createElement('div');
      item.className = 'overdue-item';
      item.innerHTML = `
        <div class="overdue-item-text">
          ${e.text}
          <div class="overdue-item-age">已超时 ${ageDays} 天</div>
        </div>
        <button class="overdue-done-btn" data-id="${e.id}" data-proj="${proj}">完成</button>

      `;
      group.appendChild(item);
    });
    content.appendChild(group);
  });

  if (!content.children.length) {
    content.innerHTML = '<div style="color:#aaa;font-size:13px;text-align:center;padding:12px 0">暂无超时任务</div>';
  }

  // 完成按钮
  content.querySelectorAll('.overdue-done-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { id, proj } = btn.dataset;
      const entry = state.entries[proj]?.find(e => e.id == id);
      if (!entry) return;
      const oldStatus = entry.status, oldTs = entry.ts;
      entry.status = 'done'; entry.ts = Date.now();
      render(); renderOverdueModal();
      const { error } = await sb.from('entries').update({ status: 'done', ts: entry.ts }).eq('id', id);
      if (error) { entry.status = oldStatus; entry.ts = oldTs; render(); renderOverdueModal(); }
    });
  });

  // 删除按钮
  content.querySelectorAll('.overdue-del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { id, proj } = btn.dataset;
      if (!confirm('确认删除这条超时任务？')) return;
      const oldEntries = [...state.entries[proj]];
      state.entries[proj] = state.entries[proj].filter(e => e.id != id);
      render(); renderOverdueModal();
      const { error } = await sb.from('entries').delete().eq('id', id);
      if (error) { state.entries[proj] = oldEntries; render(); renderOverdueModal(); }
    });
  });
}

let currentView = 'board';

function buildDoneByDate() {
  const map = {};
  Object.entries(state.entries).forEach(([proj, entries]) => {
    entries.forEach(e => {
      if (e.status !== 'done') return;
      const d = new Date(e.ts);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (!map[key]) map[key] = [];
      map[key].push({ ...e, project: proj });
    });
  });
  return map;
}

function renderCalendar() {
  const doneByDate = buildDoneByDate();
  const today = new Date();

  // title
  document.getElementById('cal-title').textContent =
    `${calYear}年${calMonth + 1}月`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // day headers: Monday first
  ['一','二','三','四','五','六','日'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-day-header';
    h.textContent = d;
    grid.appendChild(h);
  });

  const firstDayRaw = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  // Convert to Monday-based offset: Mon=0 ... Sun=6
  const firstDay = (firstDayRaw + 6) % 7;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  // prev month padding
  for (let i = firstDay - 1; i >= 0; i--) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.innerHTML = `<div class="cal-date">${daysInPrev - i}</div>`;
    grid.appendChild(cell);
  }

  // current month days
  const isViewingCurrentMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const done = doneByDate[key] || [];
    // 只有查看当月时才高亮今日
    const isToday = isViewingCurrentMonth && today.getDate() === d;

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (done.length ? ' has-done' : '') + (isToday ? ' today' : '');

    const dateEl = document.createElement('div');
    dateEl.className = 'cal-date' + (isToday ? ' today-num' : '');
    dateEl.textContent = d;
    cell.appendChild(dateEl);

    if (done.length) {
      const cnt = document.createElement('div');
      cnt.className = 'cal-done-count';
      cnt.textContent = done.length;
      cell.appendChild(cnt);

      cell.addEventListener('click', () => showDayInfo(key, done, cell));
    }
    grid.appendChild(cell);
  }

  // next month padding
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.innerHTML = `<div class="cal-date">${d}</div>`;
    grid.appendChild(cell);
  }

  renderCalendarFreq();
}

// Palette for projects (cycles if more than 8)
const PROJ_COLORS = ['#4f8ef7','#f7874f','#4fc97a','#f7c94f','#c44ff7','#f74f7a','#4fd4f7','#a0a0a0'];

function getProjColor(idx) { return PROJ_COLORS[idx % PROJ_COLORS.length]; }

function buildPeriodTotals(projects, doneByDate, rangeFilter) {
  // rangeFilter: function(dateKey) => bool
  const totals = {};
  projects.forEach(p => { totals[p] = 0; });
  Object.entries(doneByDate).forEach(([key, items]) => {
    if (!rangeFilter(key)) return;
    items.forEach(e => { if (totals[e.project] !== undefined) totals[e.project]++; });
  });
  return totals;
}

function drawPieChart(projects, totals, container) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const grandTotal = Object.values(totals).reduce((a, b) => a + b, 0);
  if (grandTotal === 0) {
    container.innerHTML = '<div style="color:#aaa;font-size:12px;text-align:center;padding:12px 0">暂无完成记录</div>';
    return;
  }

  // 找出有数据的项目，并用 state.projects 顺序确定颜色索引
  const activeProjs = projects.filter(p => totals[p] > 0);
  const getColor = p => {
    const idx = state.projects.indexOf(p);
    return getProjColor(idx >= 0 ? idx : activeProjs.indexOf(p));
  };

  const R = 60, CX = 70, CY = 70;
  const legendX = 148;
  const svgH = Math.max(140, activeProjs.length * 20 + 20);
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('viewBox', `0 0 300 ${svgH}`);
  svg.setAttribute('style', 'display:block');

  if (activeProjs.length === 1) {
    // 单项目：画整圆
    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('cx', CX); circle.setAttribute('cy', CY);
    circle.setAttribute('r', R); circle.setAttribute('fill', getColor(activeProjs[0]));
    svg.appendChild(circle);
  } else {
    let startAngle = -Math.PI / 2;
    activeProjs.forEach(p => {
      const count = totals[p];
      const angle = (count / grandTotal) * 2 * Math.PI;
      const endAngle = startAngle + angle;
      const x1 = CX + R * Math.cos(startAngle);
      const y1 = CY + R * Math.sin(startAngle);
      const x2 = CX + R * Math.cos(endAngle);
      const y2 = CY + R * Math.sin(endAngle);
      const largeArc = angle > Math.PI ? 1 : 0;
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', `M${CX},${CY} L${x1},${y1} A${R},${R} 0 ${largeArc},1 ${x2},${y2} Z`);
      path.setAttribute('fill', getColor(p));
      svg.appendChild(path);
      startAngle = endAngle;
    });
  }

  // 图例
  activeProjs.forEach((p, li) => {
    const count = totals[p];
    const ly = 16 + li * 20;
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', legendX); rect.setAttribute('y', ly - 9);
    rect.setAttribute('width', 12); rect.setAttribute('height', 12);
    rect.setAttribute('rx', 2); rect.setAttribute('fill', getColor(p));
    svg.appendChild(rect);
    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', legendX + 16); txt.setAttribute('y', ly);
    txt.setAttribute('font-size', '11'); txt.setAttribute('fill', '#333');
    txt.textContent = `${p}  ${count}次 (${Math.round(count / grandTotal * 100)}%)`;
    svg.appendChild(txt);
  });

  container.innerHTML = '';
  container.appendChild(svg);
}

let freqBaseDate = null; // null = 今天

function renderFreqChart() {
  const projects = state.projects;
  const doneByDate = buildDoneByDate();
  const lineArea = document.getElementById('freq-chart-area');
  const legendArea = document.getElementById('freq-legend');
  const base = freqBaseDate ? new Date(freqBaseDate) : new Date();

  const labels = [];
  const projData = {};
  projects.forEach(p => { projData[p] = []; });

  if (freqRange === 'week') {
    const dow = (base.getDay() + 6) % 7;
    const weekStart = new Date(base); weekStart.setDate(base.getDate() - dow); weekStart.setHours(0,0,0,0);
    for (let d = 0; d < 7; d++) {
      const day = new Date(weekStart); day.setDate(weekStart.getDate() + d);
      const key = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
      labels.push(['一','二','三','四','五','六','日'][d]);
      const entries = doneByDate[key] || [];
      projects.forEach(p => projData[p].push(entries.filter(e => e.project === p).length));
    }
  } else {
    const daysInMonth = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
    const prefix = `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-`;
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${prefix}${String(d).padStart(2,'0')}`;
      labels.push(String(d));
      const entries = doneByDate[key] || [];
      projects.forEach(p => projData[p].push(entries.filter(e => e.project === p).length));
    }
  }

  drawStackedBarChart(labels, projects, projData, lineArea);
  drawLegend(projects, legendArea);

  // 总结：本周/本月任务重点
  const summaryEl = document.getElementById('freq-summary');
  const periodTotals = {};
  projects.forEach(p => { periodTotals[p] = projData[p].reduce((a, b) => a + b, 0); });
  const topProj = projects.reduce((a, b) => (periodTotals[a] || 0) >= (periodTotals[b] || 0) ? a : b, projects[0]);
  const topCount = topProj ? periodTotals[topProj] : 0;
  if (topCount > 0) {
    summaryEl.textContent = `${freqRange === 'week' ? '本周' : '本月'}任务重点：${topProj}，共完成 ${topCount} 次`;
    summaryEl.style.display = '';
  } else {
    summaryEl.style.display = 'none';
  }
}

function drawLegend(projects, container) {
  container.innerHTML = '';
  container.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;';
  projects.forEach((p, i) => {
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;align-items:center;gap:4px;font-size:11px;color:#555;';
    item.innerHTML = `<span style="display:inline-block;width:12px;height:3px;border-radius:2px;background:${getProjColor(state.projects.indexOf(p) >= 0 ? state.projects.indexOf(p) : i)}"></span>${p}`;
    container.appendChild(item);
  });
}

function drawStackedBarChart(labels, projects, projData, container) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const W = container.clientWidth || 320;
  const n = labels.length;
  const padL = 20, padR = 8, padT = 8, padB = 22;
  const H = 110;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  // compute per-day totals for max scale
  const dayTotals = labels.map((_, i) => projects.reduce((s, p) => s + (projData[p][i] || 0), 0));
  const maxVal = Math.max(...dayTotals, 1);

  const barW = Math.max(4, Math.floor(chartW / n) - 2);
  const gap = (chartW - barW * n) / (n + 1);

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Baseline
  const base = document.createElementNS(svgNS, 'line');
  base.setAttribute('x1', padL); base.setAttribute('y1', padT + chartH);
  base.setAttribute('x2', padL + chartW); base.setAttribute('y2', padT + chartH);
  base.setAttribute('stroke', '#e0e0e0'); base.setAttribute('stroke-width', '1');
  svg.appendChild(base);

  // Bars
  for (let i = 0; i < n; i++) {
    const x = padL + gap + i * (barW + gap);
    let yOffset = padT + chartH;

    // stack from bottom: iterate projects in order
    projects.forEach((p, pi) => {
      const count = projData[p][i] || 0;
      if (count === 0) return;
      const barH = Math.max(2, (count / maxVal) * chartH);
      yOffset -= barH;
      const rect = document.createElementNS(svgNS, 'rect');
      rect.setAttribute('x', x);
      rect.setAttribute('y', yOffset);
      rect.setAttribute('width', barW);
      rect.setAttribute('height', barH);
      rect.setAttribute('fill', getProjColor(state.projects.indexOf(p) >= 0 ? state.projects.indexOf(p) : pi));
      rect.setAttribute('rx', pi === 0 ? 0 : 0); // flat segments
      svg.appendChild(rect);
    });

    // round top of the whole bar
    const total = dayTotals[i];
    if (total > 0) {
      const topY = padT + chartH - (total / maxVal) * chartH;
      const cap = document.createElementNS(svgNS, 'rect');
      cap.setAttribute('x', x); cap.setAttribute('y', topY);
      cap.setAttribute('width', barW); cap.setAttribute('height', 3);
      cap.setAttribute('rx', 2);
      cap.setAttribute('fill', 'transparent');
      svg.appendChild(cap);
    }

    // X label
    const step = n <= 12 ? 1 : Math.ceil(n / 12);
    if (i % step === 0 || i === n - 1) {
      const t = document.createElementNS(svgNS, 'text');
      t.setAttribute('x', x + barW / 2);
      t.setAttribute('y', H - 4);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '8');
      t.setAttribute('fill', '#aaa');
      t.textContent = labels[i];
      svg.appendChild(t);
    }
  }

  container.innerHTML = '';
  container.appendChild(svg);
}

function getWeekKey(date) {
  const d = new Date(date);
  const dow = (d.getDay() + 6) % 7;
  const mon = new Date(d); mon.setDate(d.getDate() - dow); mon.setHours(0,0,0,0);
  const y = mon.getFullYear();
  // ISO week number
  const jan4 = new Date(y, 0, 4);
  const startOfWeek1 = new Date(jan4); startOfWeek1.setDate(jan4.getDate() - ((jan4.getDay()+6)%7));
  const weekNum = Math.floor((mon - startOfWeek1) / 604800000) + 1;
  return `${y}-W${String(weekNum).padStart(2,'0')}`;
}
function getMonthKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

// 从 state 里读已存报告（project 字段为特殊值，status 字段存 period_key，text 存内容）
function getSavedReport(type, periodKey) {
  const proj = type === 'week' ? REPORT_WEEK_PROJ : REPORT_MONTH_PROJ;
  const list = state.entries[proj] || [];
  return list.find(e => e.status === periodKey) || null;
}

function buildReportPrompt(byProj, label) {
  const lines = [`以下是我${label}的任务完成记录：\n`];
  let total = 0;
  Object.entries(byProj).forEach(([proj, items]) => {
    lines.push(`【${proj}】${items.length}条`);
    items.forEach(e => lines.push(`  - ${e.text}`));
    total += items.length;
  });
  if (total === 0) return null;
  lines.push(`\n共完成 ${total} 条任务。`);
  lines.push('\n请用简短直接的中文输出以下内容，纯文本不用任何符号格式，风格参考：像一个了解情况的朋友在跟你说话，不废话，不用感叹号，不堆砌形容词，结论先行。\n\n分三段：\n第一段：各项目进展，每个项目一两句，说清楚做到什么程度。\n第二段：整体结论，这段时间重点在哪、推进得怎么样，一个判断。\n第三段：一句鼓励，简短，真诚，不要说"加油"之类的套话。');
  return lines.join('\n');
}

function getRangeData(type, refDate) {
  const now = refDate || new Date();
  let startTs, label;
  if (type === 'week') {
    const dow = (now.getDay() + 6) % 7;
    const start = new Date(now); start.setHours(0,0,0,0); start.setDate(now.getDate() - dow);
    startTs = start.getTime();
    const end = new Date(start); end.setDate(start.getDate() + 6);
    label = `${start.getMonth()+1}/${start.getDate()} ~ ${end.getMonth()+1}/${end.getDate()}`;
  } else {
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    startTs = start.getTime();
    const endOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59, 999).getTime();
    label = `${now.getFullYear()}年${now.getMonth()+1}月`;
    const byProj = {};
    state.projects.forEach(proj => {
      const done = (state.entries[proj] || []).filter(e => e.status === 'done' && e.ts >= startTs && e.ts <= endOfMonth);
      if (done.length) byProj[proj] = done;
    });
    return { byProj, label };
  }
  const byProj = {};
  state.projects.forEach(proj => {
    const done = (state.entries[proj] || []).filter(e => e.status === 'done' && e.ts >= startTs);
    if (done.length) byProj[proj] = done;
  });
  return { byProj, label };
}

async function callAiApi(prompt) {
  const resp = await fetch(`${OPENAI_BASE_URL}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENAI_API_KEY}` },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', messages: [{ role: 'user', content: prompt }] })
  });
  if (!resp.ok) throw new Error(await resp.text());
  const json = await resp.json();
  return json.choices?.[0]?.message?.content || '';
}

async function saveReport(type, periodKey, content) {
  const proj = type === 'week' ? REPORT_WEEK_PROJ : REPORT_MONTH_PROJ;
  const ts = Date.now();
  // 检查是否已存在
  const existing = getSavedReport(type, periodKey);
  if (existing) {
    await sb.from('entries').update({ text: content, ts }).eq('id', existing.id);
    existing.text = content; existing.ts = ts;
  } else {
    const { data, error } = await sb.from('entries')
      .insert({ project: proj, text: content, status: periodKey, ts, orig_ts: ts })
      .select().single();
    if (!error && data) {
      if (!state.entries[proj]) state.entries[proj] = [];
      state.entries[proj].push({ id: data.id, text: content, status: periodKey, ts, origTs: ts });
    }
  }
}

async function autoGenerateReport(type) {
  if (!isReportEnabled()) return; // ③ 开关关闭时不生成
  const now = new Date();
  const periodKey = type === 'week' ? getWeekKey(now) : getMonthKey(now);
  if (getSavedReport(type, periodKey)) return; // 已生成过
  const { byProj, label } = getRangeData(type, now);
  const prompt = buildReportPrompt(byProj, label);
  if (!prompt) return;
  try {
    const content = await callAiApi(prompt);
    if (content) {
      await saveReport(type, periodKey, content);
      // ② 生成后推送通知
      addReportNotification(type, periodKey, label);
    }
  } catch (e) { console.warn('Auto report failed:', e); }
}

// 检查是否需要自动生成报告（周日 or 月末，且当天还没生成过）
function checkAutoReport() {
  const now = new Date();
  const isSunday = now.getDay() === 0;
  const isLastDayOfMonth = now.getDate() === new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  if (isSunday) autoGenerateReport('week');
  if (isLastDayOfMonth) autoGenerateReport('month');
}

// 每小时检查一次（页面打开时也立即检查）
function startAutoReportScheduler() {
  checkAutoReport();
  setInterval(checkAutoReport, 60 * 60 * 1000);
}

// 打开 AI 报告弹窗，显示指定报告
function openReportModal(type, periodKey, periodLabel) {
  const modal = document.getElementById('ai-modal');
  const title = document.getElementById('ai-modal-title');
  const result = document.getElementById('ai-result');
  title.textContent = `AI ${type === 'week' ? '周报' : '月报'} · ${periodLabel}`;
  const saved = getSavedReport(type, periodKey);
  if (saved) {
    result.className = '';
    result.textContent = saved.text;
  } else {
    result.className = 'loading';
    result.textContent = '该时段暂无报告（报告在周日/月末自动生成）';
  }
  modal.classList.add('show');
}

document.getElementById('ai-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('ai-modal'))
    document.getElementById('ai-modal').classList.remove('show');
});
document.getElementById('ai-copy-btn').addEventListener('click', () => {
  const text = document.getElementById('ai-result').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('ai-copy-btn');
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
});

// ② 通知系统
function addReportNotification(type, periodKey, label) {
  // 避免重复
  if (notifications.find(n => n.type === type && n.periodKey === periodKey)) return;
  notifications.unshift({ type, periodKey, label, read: false, ts: Date.now() });
  saveNotifications();
  renderNotifDot();
}

function renderNotifDot() {
  const hasUnread = notifications.some(n => !n.read);
  document.getElementById('notif-dot').classList.toggle('show', hasUnread);
}

function renderNotifPanel() {
  const list = document.getElementById('notif-list');
  const empty = document.getElementById('notif-empty');
  list.innerHTML = '';
  if (!notifications.length) {
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  notifications.forEach((n, i) => {
    const item = document.createElement('div');
    item.className = 'notif-item';
    item.innerHTML = `
      <div class="notif-item-body">
        <div class="notif-item-title">AI ${n.type === 'week' ? '周报' : '月报'} 已生成</div>
        <div class="notif-item-sub">${n.label}</div>
      </div>
      <button class="notif-dismiss" data-idx="${i}" title="删除通知">×</button>
    `;
    item.querySelector('.notif-item-body').addEventListener('click', () => {
      n.read = true;
      saveNotifications();
      renderNotifDot();
      openReportModal(n.type, n.periodKey, n.label);
      document.getElementById('notif-panel').classList.remove('show');
    });
    item.querySelector('.notif-dismiss').addEventListener('click', (e) => {
      e.stopPropagation();
      notifications.splice(i, 1);
      saveNotifications();
      renderNotifDot();
      renderNotifPanel();
    });
    list.appendChild(item);
  });
}

document.getElementById('notif-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  const panel = document.getElementById('notif-panel');
  const isOpen = panel.classList.toggle('show');
  if (isOpen) {
    renderNotifPanel();
    // 标记全部已读
    notifications.forEach(n => n.read = true);
    saveNotifications();
    renderNotifDot();
  }
});
document.addEventListener('click', (e) => {
  if (!document.getElementById('notif-panel').contains(e.target) &&
      e.target !== document.getElementById('notif-btn')) {
    document.getElementById('notif-panel').classList.remove('show');
  }
});

// ③ 报告开关
function renderReportToggleBtn() {
  const wrap = document.getElementById('report-toggle-btn');
  if (!wrap) return;
  const on = isReportEnabled();
  wrap.classList.toggle('on', on);
  wrap.classList.toggle('off', !on);
}

document.getElementById('report-toggle-btn').addEventListener('click', () => {
  const on = isReportEnabled();
  const msg = on
    ? '关闭后将不再自动生成周/月报，已生成的报告不受影响。确认关闭？'
    : '开启后将在每周日和每月最后一天自动生成报告。确认开启？';
  if (!confirm(msg)) return;
  setReportEnabled(!on);
  renderReportToggleBtn();
});

// 日历日期点击后显示报告入口
function updateReportLinks(dateKey) {
  const links = document.getElementById('report-links');
  const weekBtn = document.getElementById('week-report-btn');
  const monthBtn = document.getElementById('month-report-btn');
  const d = new Date(dateKey);
  const weekKey = getWeekKey(d);
  const monthKey = getMonthKey(d);

  const dow = (d.getDay() + 6) % 7;
  const mon = new Date(d); mon.setDate(d.getDate() - dow);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const weekLabel = `${mon.getMonth()+1}/${mon.getDate()} ~ ${sun.getMonth()+1}/${sun.getDate()}`;
  const monthLabel = `${d.getFullYear()}年${d.getMonth()+1}月`;

  const hasWeek = !!getSavedReport('week', weekKey);
  const hasMonth = !!getSavedReport('month', monthKey);

  weekBtn.textContent = `📄 周报${hasWeek ? '' : '（未生成）'}`;
  monthBtn.textContent = `📄 月报${hasMonth ? '' : '（未生成）'}`;

  weekBtn.onclick = () => openReportModal('week', weekKey, weekLabel);
  monthBtn.onclick = () => openReportModal('month', monthKey, monthLabel);

  renderReportToggleBtn();
  links.classList.add('show');
}

// ④ 垃圾桶弹窗
function renderTrashModal() {
  const content = document.getElementById('trash-content');
  const empty = document.getElementById('trash-empty');
  content.innerHTML = '';

  if (!trash.length) {
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  // 分组：项目 / 任务
  const projItems = trash.filter(t => t.type === 'project');
  const entryItems = trash.filter(t => t.type === 'entry');

  function renderGroup(items, title) {
    if (!items.length) return;
    const sec = document.createElement('div');
    sec.innerHTML = `<div class="trash-section-title">${title}</div>`;
    items.forEach((t, rawIdx) => {
      const idx = trash.indexOf(t);
      const item = document.createElement('div');
      item.className = 'trash-item';
      const label = t.type === 'project'
        ? `项目「${t.proj}」（${t.entries.length} 条记录）`
        : t.entry.text;
      const sub = t.type === 'project'
        ? `删除于 ${formatTime(t.ts)}`
        : `${t.proj} · ${formatTime(t.ts)}`;
      item.innerHTML = `
        <div class="trash-item-body">
          <div class="trash-item-text">${label}</div>
          <div class="trash-item-sub">${sub}</div>
        </div>
        <button class="trash-restore-btn" data-idx="${idx}" title="撤回"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="trash-perm-del-btn" data-idx="${idx}" title="永久删除">×</button>
      `;
      sec.appendChild(item);
    });
    content.appendChild(sec);
  }

  renderGroup(projItems, '已删除项目');
  renderGroup(entryItems, '已删除任务');

  // 撤回
  content.querySelectorAll('.trash-restore-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = Number(btn.dataset.idx);
      const t = trash[idx];
      if (!t) return;
      trash.splice(idx, 1);

      if (t.type === 'project') {
        state.projects.push(t.proj);
        state.entries[t.proj] = t.entries;
        saveOrder();
        render();
        // 重新 insert 到 DB
        for (const e of t.entries) {
          const { data } = await sb.from('entries')
            .insert({ project: t.proj, text: e.text, status: e.status, ts: e.ts, orig_ts: e.origTs || e.ts })
            .select().single();
          if (data) e.id = data.id;
        }
      } else {
        if (!state.entries[t.proj]) state.entries[t.proj] = [];
        state.entries[t.proj].push(t.entry);
        state.entries[t.proj].sort((a, b) => (a.origTs || a.ts) - (b.origTs || b.ts));
        render();
        const e = t.entry;
        const { data } = await sb.from('entries')
          .insert({ project: t.proj, text: e.text, status: e.status, ts: e.ts, orig_ts: e.origTs || e.ts })
          .select().single();
        if (data) {
          const restored = state.entries[t.proj].find(x => x.id === e.id);
          if (restored) restored.id = data.id;
        }
      }
      renderTrashModal();
    });
  });

  // 永久删除（仅从垃圾桶移除，DB 已删）
  content.querySelectorAll('.trash-perm-del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const t = trash[idx];
      const label = t.type === 'project' ? `项目「${t.proj}」` : `任务「${t.entry.text.slice(0,20)}」`;
      if (!confirm(`永久删除${label}？此操作不可撤回。`)) return;
      trash.splice(idx, 1);
      renderTrashModal();
    });
  });
}

document.getElementById('trash-btn').addEventListener('click', () => {
  renderTrashModal();
  document.getElementById('trash-modal').classList.add('show');
});
document.getElementById('trash-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('trash-modal'))
    document.getElementById('trash-modal').classList.remove('show');
});
</script>
