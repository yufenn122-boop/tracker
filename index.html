<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目进度表</title>
<link rel="manifest" href="/tracker/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="/tracker/icon-192.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { max-width: 100vw; overflow-x: hidden; }
  body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; }

  header {
    background: #1a1a2e;
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; flex: 1; min-width: 80px; }

  /* 搜索展开行 — 默认隐藏，点放大镜后显示 */
  .header-row2 {
    width: 100%;
    display: none;
    gap: 8px;
    align-items: center;
  }
  .header-row2.open { display: flex; }

  #search-toggle {
    background: none;
    border: none;
    color: rgba(255,255,255,0.8);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
  }
  #search-toggle:hover { background: rgba(255,255,255,0.1); }

  #search-input {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-family: inherit;
    min-width: 0;
  }
  #search-input::placeholder { color: rgba(255,255,255,0.5); }
  #search-input:focus { background: rgba(255,255,255,0.25); }
  #time-filter {
    border: none;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    background: rgba(255,255,255,0.15);
    color: white;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  #time-filter option { background: #1a1a2e; color: white; }
  .header-btn {
    background: #4f8ef7;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .header-btn:hover { background: #3a7de0; }
  #export-btn { background: #27ae60; }
  #export-btn:hover { background: #1e8449; }

  /* 超时提醒条 */
  #overdue-banner {
    display: none;
    background: #fff3cd;
    border-bottom: 1px solid #ffc107;
    padding: 8px 16px;
    font-size: 13px;
    color: #856404;
    cursor: pointer;
    user-select: none;
  }
  #overdue-banner:hover { background: #ffe69c; }

  /* 超时弹窗 */
  #overdue-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 300;
    align-items: center; justify-content: center;
  }
  #overdue-modal.show { display: flex; }
  #overdue-box {
    background: white; border-radius: 12px; padding: 20px;
    width: 340px; max-height: 75vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    display: flex; flex-direction: column; gap: 12px;
  }
  #overdue-box h2 { font-size: 15px; color: #1a1a2e; }
  .overdue-proj-name {
    font-size: 11px; font-weight: 600; color: #f97316;
    margin-bottom: 6px; text-transform: uppercase;
  }
  .overdue-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; background: #fff8f0;
    border-radius: 6px; margin-bottom: 4px;
  }
  .overdue-item-text { flex: 1; font-size: 13px; color: #333; }
  .overdue-item-age { font-size: 10px; color: #aaa; margin-top: 2px; }
  .overdue-done-btn {
    background: #27ae60; color: white; border: none;
    border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; flex-shrink: 0;
  }
  .overdue-del-btn {
    background: #e74c3c; color: white; border: none;
    border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; flex-shrink: 0;
  }

  @media (max-width: 600px) {
    #overdue-box { width: calc(100vw - 32px); }
  }

  /* ── Desktop: horizontal board ── */
  #board {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 20px 16px;
    overflow-x: auto;
    align-items: flex-start;
    max-width: 100vw;
    height: 0; /* forces flex child to respect max-height */
  }

  .column {
    background: white;
    border-radius: 10px;
    min-width: 210px;
    width: 210px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }

  .col-header {
    padding: 12px 14px;
    font-weight: 600;
    font-size: 14px;
    border-bottom: 2px solid #4f8ef7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f7f9ff;
    border-radius: 10px 10px 0 0;
    cursor: grab;
    user-select: none;
  }
  .col-header:active { cursor: grabbing; }
  .column.dragging { opacity: 0.4; }
  .column.drag-over { outline: 2px dashed #4f8ef7; outline-offset: 2px; }
  .col-header-left { display: flex; align-items: center; gap: 8px; }
  .col-header span.col-title { color: #1a1a2e; }
  .col-count {
    background: #f97316;
    color: white;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .col-count.all-done {
    background: transparent;
    color: #27ae60;
    font-size: 13px;
    width: auto;
    height: auto;
    font-weight: 700;
    border-radius: 0;
  }
  .col-chevron { display: none; font-size: 12px; color: #aaa; transition: transform 0.2s; }
  .delete-col {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    line-height: 1;
  }
  .delete-col:hover { color: #e74c3c; }

  /* current progress preview — hidden on desktop */
  .col-preview { display: none; }

  .col-entries {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: #d0d7e3 transparent;
  }
  .col-entries::-webkit-scrollbar { width: 4px; }
  .col-entries::-webkit-scrollbar-track { background: transparent; }
  .col-entries::-webkit-scrollbar-thumb { background: #d0d7e3; border-radius: 2px; }
  .col-entries::-webkit-scrollbar-thumb:hover { background: #aab4c8; }

  /* Entry */
  .entry {
    border-radius: 6px;
    padding: 8px 10px 8px 10px;
    font-size: 13px;
    color: #333;
    position: relative;
    border: none;
    transition: background 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .entry.todo { background: #fff3e0; }
  .entry.done { background: #f0fff4; }
  .entry.done .entry-text { text-decoration: line-through; color: #999; }

  .status-btn {
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.15);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    white-space: nowrap;
    transition: opacity 0.2s;
    margin-top: 1px;
  }
  .entry.todo .status-btn { background: #f97316; color: white; }
  .entry.done .status-btn { background: #27ae60; color: white; }

  .entry-body { flex: 1; min-width: 0; }
  .entry-text { word-break: break-all; outline: none; min-height: 1em; }
  .entry-text[contenteditable="true"] {
    background: #fffbe6;
    border-radius: 3px;
    padding: 1px 3px;
    box-shadow: 0 0 0 1px #f0c040;
  }
  .entry .entry-time { font-size: 10px; color: #aaa; margin-top: 4px; }
  .entry-actions { display: none; gap: 4px; flex-shrink: 0; align-self: flex-start; margin-top: 1px; }
  .entry:hover .entry-actions { display: flex; }
  .entry-actions button {
    background: none; border: none; cursor: pointer;
    font-size: 15px; color: #bbb; padding: 2px 5px; border-radius: 3px;
  }
  .entry-actions .edit-btn:hover { color: #4f8ef7; background: #eef3ff; }
  .entry-actions .delete-entry:hover { color: #e74c3c; background: #fff0f0; }

  .empty-hint { color: #ccc; font-size: 12px; text-align: center; padding: 20px 0; }
  .all-done-hint { color: #27ae60; font-size: 13px; text-align: center; padding: 10px 0 4px; font-weight: 600; }

  /* Footer */
  footer {
    background: white;
    border-top: 1px solid #e8e8e8;
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    width: 100%;
  }

  #project-select {
    border: 1px solid #d0d7e3;
    border-radius: 8px;
    padding: 8px 8px;
    font-size: 13px;
    background: white;
    color: #333;
    width: 90px;
    outline: none;
    flex-shrink: 0;
  }
  #project-select:focus { border-color: #4f8ef7; }

  #entry-input {
    flex: 1;
    border: 1px solid #d0d7e3;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  #entry-input:focus { border-color: #4f8ef7; }

  #submit-btn {
    background: #4f8ef7;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #submit-btn:hover { background: #3a7de0; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white; border-radius: 12px; padding: 24px;
    width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; color: #1a1a2e; }
  .modal input {
    width: 100%; border: 1px solid #d0d7e3; border-radius: 8px;
    padding: 9px 12px; font-size: 14px; outline: none; margin-bottom: 14px;
  }
  .modal input:focus { border-color: #4f8ef7; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btns button { padding: 7px 18px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; }
  .btn-cancel { background: #f0f2f5; color: #666; }
  .btn-confirm { background: #4f8ef7; color: white; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    body { padding-bottom: 60px; } /* 给固定 footer 留空间 */

    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    }

    #board {
      flex-direction: column;
      overflow-x: hidden;
      padding: 12px;
      gap: 10px;
    }

    .column {
      width: 100%;
      min-width: unset;
      max-height: none;
      overflow: hidden;
    }

    /* collapsed by default on mobile */
    .column .col-entries { display: none; }
    .column.open .col-entries { display: flex; max-height: 40vh; overflow-y: auto; }

    .col-header { cursor: pointer; border-radius: 10px; border-bottom: none; }
    .column.open .col-header { border-radius: 10px 10px 0 0; border-bottom: 2px solid #4f8ef7; }

    .col-chevron { display: inline-block; }
    .column.open .col-chevron { transform: rotate(180deg); }

    /* current progress preview */
    .col-preview {
      display: block;
      padding: 6px 14px 10px;
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: white;
      border-radius: 0 0 10px 10px;
    }
    .column.open .col-preview { display: none; }
    .col-preview .preview-label {
      display: inline-block;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      margin-right: 6px;
      vertical-align: middle;
      color: white;
    }
    .preview-label.todo { background: #f97316; }
    .preview-label.done { background: #27ae60; }
    .preview-label.empty { display: none; }
    .col-preview .preview-text {
      vertical-align: middle;
    }

    /* show entry-actions on mobile via tap */
    .entry:hover .entry-actions { display: none; }
    .entry.tapped .entry-actions { display: flex; align-self: flex-start; }
  }
  /* Date picker modal */
  #date-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 200;
    align-items: center; justify-content: center;
  }
  #date-modal.show { display: flex; }
  #date-box {
    background: white; border-radius: 12px; padding: 24px;
    width: 280px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    display: flex; flex-direction: column; gap: 12px;
  }
  #date-box h2 { font-size: 15px; color: #1a1a2e; }
  #date-box label { font-size: 13px; color: #555; display: flex; flex-direction: column; gap: 4px; }
  #date-box input[type=date] {
    border: 1px solid #d0d7e3; border-radius: 7px;
    padding: 7px 10px; font-size: 13px; outline: none; font-family: inherit;
  }
  #date-box input[type=date]:focus { border-color: #4f8ef7; }
  .date-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .date-btns button { padding: 7px 16px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; }

  /* Filter badge */
  #filter-badge {
    display: none;
    background: #f97316;
    color: white;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #filter-badge.show { display: inline-block; }
  #auth-overlay {
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #auth-box {
    background: white;
    border-radius: 14px;
    padding: 32px 28px;
    width: 300px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #auth-box h2 { font-size: 17px; color: #1a1a2e; text-align: center; }
  #auth-input {
    border: 1px solid #d0d7e3;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    width: 100%;
  }
  #auth-input:focus { border-color: #4f8ef7; }
  #auth-error { color: #e74c3c; font-size: 13px; text-align: center; min-height: 18px; }
  #auth-btn {
    background: #4f8ef7;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  #auth-btn:hover { background: #3a7de0; }

  /* ── Calendar View ── */
  #calendar-view {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    flex-direction: column;
    gap: 16px;
  }
  #calendar-view.active { display: flex; }
  #board.hidden { display: none; }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a2e;
  }
  .cal-nav button {
    background: none;
    border: 1px solid #d0d7e3;
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 14px;
    color: #555;
  }
  .cal-nav button:hover { background: #f0f2f5; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day-header {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: #aaa;
    padding: 4px 0;
  }
  .cal-cell {
    background: white;
    border-radius: 8px;
    min-height: 68px;
    padding: 6px;
    cursor: default;
    border: 1px solid #f0f2f5;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cal-cell.has-done { cursor: pointer; }
  .cal-cell.has-done:hover { border-color: #4f8ef7; background: #f7f9ff; }
  .cal-cell.today { border-color: #4f8ef7; }
  .cal-cell.other-month { background: #fafafa; }
  .cal-cell.other-month .cal-date { color: #ccc; }
  .cal-date {
    font-size: 12px;
    font-weight: 600;
    color: #333;
  }
  .cal-date.today-num {
    background: #4f8ef7;
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .cal-done-count {
    font-size: 12px;
    color: #27ae60;
    font-weight: 700;
    background: #e6f9ee;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: flex-start;
  }

  /* Frequency chart */
  .freq-section {
    background: white;
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .freq-title {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 10px;
  }
  .freq-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .freq-tab {
    border: 1px solid #d0d7e3;
    background: white;
    border-radius: 6px;
    padding: 3px 12px;
    font-size: 12px;
    cursor: pointer;
    color: #555;
  }
  .freq-tab.active { background: #4f8ef7; color: white; border-color: #4f8ef7; }
  #freq-chart-area { width: 100%; overflow-x: auto; }

  /* Day inline info panel */
  #day-info-panel {
    background: white; border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: none;
  }
  #day-info-panel.show { display: block; }
  #day-info-title {
    font-size: 13px; font-weight: 600; color: #1a1a2e; margin-bottom: 10px;
  }
  #day-info-pie { width: 100%; }
  #day-detail-btn {
    margin-top: 10px; width: 100%;
    background: #4f8ef7; color: white; border: none;
    border-radius: 8px; padding: 8px 0; font-size: 13px; cursor: pointer;
  }
  #day-detail-btn:hover { background: #3a7de0; }

  /* Day detail modal */
  #day-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 300;
    align-items: center; justify-content: center;
  }
  #day-modal.show { display: flex; }
  #day-box {
    background: white; border-radius: 12px; padding: 20px;
    width: 320px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    display: flex; flex-direction: column; gap: 10px;
  }
  #day-box h2 { font-size: 15px; color: #1a1a2e; }
  .day-proj-group { margin-bottom: 6px; }
  .day-proj-name {
    font-size: 11px; font-weight: 600; color: #4f8ef7;
    margin-bottom: 4px; text-transform: uppercase;
  }
  .day-entry-item {
    font-size: 13px; color: #333; padding: 5px 8px;
    background: #f0fff4; border-radius: 6px; margin-bottom: 3px;
  }
  .day-entry-time { font-size: 10px; color: #aaa; margin-top: 2px; }

  @media (max-width: 600px) {
    .cal-cell { min-height: 52px; padding: 4px; }
    .cal-done-count { font-size: 9px; }
    #day-box { width: calc(100vw - 32px); }
  }
</style>
</head>
<body>

<div id="auth-overlay">
  <div id="auth-box">
    <h2>请输入密码</h2>
    <input id="auth-input" type="password" placeholder="密码" />
    <div id="auth-error"></div>
    <button id="auth-btn">进入</button>
  </div>
</div>

<header>
  <h1>项目进度表</h1>
  <button id="search-toggle" title="搜索">🔍</button>
  <button class="header-btn" id="cal-toggle-btn">📅 日历</button>
  <button class="header-btn" id="overdue-btn" style="background:#e74c3c;display:none">⏰ 超时</button>
  <button class="header-btn" id="export-btn">导出</button>
  <button class="header-btn" id="add-project-btn">+ 项目</button>
  <div class="header-row2">
    <input id="search-input" type="text" placeholder="搜索记录..." />
    <select id="time-filter">
      <option value="all">全部</option>
      <option value="today">今日</option>
      <option value="week">本周</option>
      <option value="month">本月</option>
      <option value="custom">自定义</option>
    </select>
    <span id="filter-badge">已筛选 ×</span>
  </div>
</header>

<div id="overdue-banner"></div>

<script>
const SUPABASE_URL = 'https://rokrwejqxrpswpkzhawx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OpTUNdpvmVR93h-i6XB3pQ_TrWR8ikx';

const PASSWORD_HASH = '2b7d5805cbee2a961ed2633e809f05c23e2146bd4cd222959f3abfa04f2e806d';

// SHA-256 fallback for non-secure contexts
async function simpleHash(str) {
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  // djb2-based fallback (not cryptographically secure, only used when SubtleCrypto unavailable)
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return (h >>> 0).toString(16).padStart(8, '0');
}

// Auth
(function() {
  const overlay = document.getElementById('auth-overlay');
  const input = document.getElementById('auth-input');
  const btn = document.getElementById('auth-btn');
  const error = document.getElementById('auth-error');

  overlay.style.display = 'flex';

  async function tryLogin() {

  setTimeout(() => input.focus(), 100);
})();

const DEFAULTS = ['家教', '督学群', '单片机', '自媒体', '雪花酥'];
let state = { projects: [], entries: {} };
const openCols = new Set();

// Project order persistence
function saveOrder() {
  localStorage.setItem('proj_order', JSON.stringify(state.projects));
}
function loadOrder() {
  try { return JSON.parse(localStorage.getItem('proj_order')) || []; } catch { return []; }
}

// Filter state
let filterKeyword = '';
let filterRange = { type: 'all', start: null, end: null };

function getFilteredEntries(entries) {
  return entries.filter(e => {
    // keyword
    if (filterKeyword && !e.text.toLowerCase().includes(filterKeyword.toLowerCase())) return false;
    // time
    if (filterRange.type === 'today') {
      const d = new Date(e.ts), now = new Date();
      if (d.toDateString() !== now.toDateString()) return false;
    } else if (filterRange.type === 'week') {
      const now = new Date(), day = now.getDay() || 7;
      const weekStart = new Date(now); weekStart.setHours(0,0,0,0); weekStart.setDate(now.getDate() - day + 1);
      if (e.ts < weekStart.getTime()) return false;
    } else if (filterRange.type === 'month') {
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      if (e.ts < monthStart.getTime()) return false;
    } else if (filterRange.type === 'custom' && filterRange.start && filterRange.end) {
      if (e.ts < filterRange.start || e.ts > filterRange.end) return false;
    }
    return true;
  });
}

function formatTime(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}


async function loadFromDB() {
  const { data, error } = await sb.from('entries').select('*').order('ts', { ascending: true });
  if (error) { console.error(error); return; }

  const projects = new Set(DEFAULTS);
  const entries = {};
  DEFAULTS.forEach(p => entries[p] = []);

  data.forEach(row => {
    if (!projects.has(row.project)) {
      projects.add(row.project);
      entries[row.project] = [];
    }
    entries[row.project].push({ id: row.id, text: row.text, status: row.status, ts: row.ts, origTs: row.orig_ts || row.ts });
  });

  state.projects = Array.from(projects);

  // Apply saved order
  const savedOrder = loadOrder();
  if (savedOrder.length) {
    const ordered = savedOrder.filter(p => state.projects.includes(p));
    const rest = state.projects.filter(p => !ordered.includes(p));
    state.projects = [...ordered, ...rest];
  }

  state.entries = entries;
  render();
}

function render() {
  const board = document.getElementById('board');
  const select = document.getElementById('project-select');
  const prevSelected = select.value;

  board.innerHTML = '';
  select.innerHTML = '';

  const isMobile = window.innerWidth <= 600;
  const isFiltering = filterKeyword || filterRange.type !== 'all';
  const now = Date.now();
  const OVERDUE_MS = 7 * 24 * 60 * 60 * 1000;
  const todayStr = new Date().toDateString();

  // update badge
  const badge = document.getElementById('filter-badge');
  badge.classList.toggle('show', isFiltering);

  // 超时提醒条 + 按钮
  const overdueBanner = document.getElementById('overdue-banner');
  const overdueBtn = document.getElementById('overdue-btn');
  let totalOverdue = 0;
  state.projects.forEach(proj => {
    (state.entries[proj] || []).forEach(e => {
      if (e.status === 'todo' && (now - (e.origTs || e.ts)) > OVERDUE_MS) totalOverdue++;
    });
  });
  if (totalOverdue > 0) {
    overdueBanner.textContent = `⚠️ 当前存在 ${totalOverdue} 条超时任务，点击查看`;
    overdueBanner.style.display = 'block';
    overdueBtn.style.display = '';
    overdueBtn.textContent = `⏰ 超时 ${totalOverdue}`;
  } else {
    overdueBanner.style.display = 'none';
    overdueBtn.style.display = 'none';
  }

  state.projects.forEach(proj => {
    const allEntries = state.entries[proj] || [];

    // 看板只显示：未超时的 todo + 今日完成的 done
    const visibleEntries = allEntries.filter(e => {
      if (e.status === 'todo') return (now - (e.origTs || e.ts)) <= OVERDUE_MS;
      if (e.status === 'done') return new Date(e.ts).toDateString() === todayStr;
      return false;
    });

    const entries = isFiltering ? getFilteredEntries(visibleEntries) : visibleEntries;
    const latest = allEntries[allEntries.length - 1];

    // hide column if filtering and no results
    if (isFiltering && entries.length === 0) {
      const opt = document.createElement('option');
      opt.value = proj; opt.textContent = proj;
      select.appendChild(opt);
      return;
    }

    const col = document.createElement('div');
    col.className = 'column' + (openCols.has(proj) ? ' open' : '');

    // 徽章只计未超时的 todo
    const todoCount = allEntries.filter(e => e.status === 'todo' && (now - (e.origTs || e.ts)) <= OVERDUE_MS).length;
    const allDone = allEntries.length > 0 && allEntries.filter(e => e.status === 'todo').length === 0;
    const countLabel = allDone ? '全部完成！🎉' : String(todoCount);

    const entriesHtml = entries.length === 0
      ? '<div class="empty-hint">暂无记录</div>'
      : entries.map((e) => `
          <div class="entry ${e.status}" data-id="${e.id}" data-proj="${proj}" data-idx="${allEntries.indexOf(e)}">
            <button class="status-btn" data-id="${e.id}" data-proj="${proj}" data-idx="${allEntries.indexOf(e)}">${e.status === 'todo' ? '待办' : '完成'}</button>
            <div class="entry-body">
              <div class="entry-text">${e.text}</div>
              <div class="entry-time">${formatTime(e.ts)}</div>
            </div>
            <div class="entry-actions">
              <button class="edit-btn" data-id="${e.id}" data-proj="${proj}" data-idx="${allEntries.indexOf(e)}">✎</button>
              <button class="delete-entry" data-id="${e.id}" data-proj="${proj}">🗑</button>
            </div>
          </div>`).join('');

    // Preview: prioritize earliest todo, fallback to latest entry
    const firstTodo = allEntries.find(e => e.status === 'todo');
    const previewEntry = firstTodo || allEntries[allEntries.length - 1];
    const previewHtml = previewEntry
      ? `<span class="preview-label ${previewEntry.status}">${previewEntry.status === 'todo' ? '当前进度' : '已完成'}</span><span class="preview-text">${previewEntry.text}</span>`
      : '暂无记录';

    col.innerHTML = `
      <div class="col-header">
        <div class="col-header-left">
          <span class="col-chevron">▼</span>
          <span class="col-title">${proj}</span>
          <span class="col-count">${countLabel}</span>
        </div>
        <button class="delete-col" data-proj="${proj}">×</button>
      </div>
      <div class="col-preview">${previewHtml}</div>
      <div class="col-entries" id="col-${proj}">${entriesHtml}</div>
    `;
    // 全部完成时给 badge 加样式
    const countBadge = col.querySelector('.col-count');
    if (allDone) countBadge.classList.add('all-done');
    board.appendChild(col);

    // Drag and drop
    const header = col.querySelector('.col-header');
    col.draggable = true;
    col.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', proj);
      setTimeout(() => col.classList.add('dragging'), 0);
    });
    col.addEventListener('dragend', () => {
      col.classList.remove('dragging');
      document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
    });
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const fromProj = e.dataTransfer.getData('text/plain');
      const toProj = proj;
      if (fromProj === toProj) return;
      const fromIdx = state.projects.indexOf(fromProj);
      const toIdx = state.projects.indexOf(toProj);
      state.projects.splice(fromIdx, 1);
      state.projects.splice(toIdx, 0, fromProj);
      saveOrder();
      render();
    });

    // Mobile long-press drag (touch)
    let touchDragProj = null, longPressTimer = null;
    header.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('delete-col')) return;
      longPressTimer = setTimeout(() => {
        touchDragProj = proj;
        col.classList.add('dragging');
        navigator.vibrate && navigator.vibrate(40);
      }, 500);
    }, { passive: true });
    header.addEventListener('touchend', () => {
      clearTimeout(longPressTimer);
      if (touchDragProj) {
        col.classList.remove('dragging');
        touchDragProj = null;
      }
    });
    header.addEventListener('touchmove', (e) => {
      if (!touchDragProj) return;
      e.preventDefault();
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetCol = el && el.closest('.column');
      document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
      if (targetCol && targetCol !== col) {
        targetCol.classList.add('drag-over');
        const toProj = targetCol.querySelector('.col-title').textContent;
        const fromIdx = state.projects.indexOf(touchDragProj);
        const toIdx = state.projects.indexOf(toProj);
        if (fromIdx !== toIdx) {
          state.projects.splice(fromIdx, 1);
          state.projects.splice(toIdx, 0, touchDragProj);
          saveOrder();
          render();
        }
      }
    }, { passive: false });

    if (!isMobile || openCols.has(proj)) {
      const colEntries = col.querySelector('.col-entries');
      colEntries.scrollTop = colEntries.scrollHeight;
    }

    const opt = document.createElement('option');
    opt.value = proj; opt.textContent = proj;
    select.appendChild(opt);
  });

  if (prevSelected && state.projects.includes(prevSelected)) {
    select.value = prevSelected;
  }

  // Mobile: toggle open/close on header click
  document.querySelectorAll('.col-header').forEach(header => {
    header.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-col')) return;
      if (!window.matchMedia('(max-width: 600px)').matches) return;
      const col = header.closest('.column');
      const proj = col.querySelector('.col-title').textContent;
      if (openCols.has(proj)) openCols.delete(proj);
      else openCols.add(proj);
      render();
    });
  });

  // Mobile: tap entry to show actions
  document.querySelectorAll('.entry').forEach(entry => {
    entry.addEventListener('click', (e) => {
      if (!window.matchMedia('(max-width: 600px)').matches) return;
      if (e.target.closest('.entry-actions') || e.target.classList.contains('status-btn')) return;
      document.querySelectorAll('.entry.tapped').forEach(el => el.classList.remove('tapped'));
      entry.classList.toggle('tapped');
    });
  });

  // Delete column
  document.querySelectorAll('.delete-col').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const proj = btn.dataset.proj;
      if (!confirm(`确认删除项目「${proj}」及其所有记录？`)) return;
      const oldProjects = [...state.projects];
      const oldEntries = { ...state.entries };
      // Optimistic update
      state.projects = state.projects.filter(p => p !== proj);
      delete state.entries[proj];
      openCols.delete(proj);
      render();
      const { error } = await sb.from('entries').delete().eq('project', proj);
      if (error) { state.projects = oldProjects; state.entries = oldEntries; render(); }
    });
  });

  // Toggle status
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { id, proj, idx } = btn.dataset;
      const entry = state.entries[proj][Number(idx)];
      const oldStatus = entry.status;
      const newStatus = oldStatus === 'todo' ? 'done' : 'todo';
      const newTs = newStatus === 'done' ? Date.now() : entry.origTs;
      const oldTs = entry.ts;
      // Optimistic update — preserve scroll position
      entry.status = newStatus;
      entry.ts = newTs;
      const savedY = window.scrollY;
      render();
      window.scrollTo({ top: savedY, behavior: 'instant' });
      const { error } = await sb.from('entries').update({ status: newStatus, ts: newTs }).eq('id', id);
      if (error) {
        entry.status = oldStatus; entry.ts = oldTs;
        const savedY2 = window.scrollY;
        render();
        window.scrollTo({ top: savedY2, behavior: 'instant' });
      }
    });
  });

  // Edit entry
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const { id, proj, idx } = btn.dataset;
      const entryEl = btn.closest('.entry');
      const textEl = entryEl.querySelector('.entry-text');
      if (textEl.contentEditable === 'true') return;

      textEl.contentEditable = 'true';
      textEl.focus();
      const range = document.createRange();
      range.selectNodeContents(textEl);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      async function saveEdit() {
        const newText = textEl.innerText.trim();
        textEl.contentEditable = 'false';
        if (newText && newText !== state.entries[proj][Number(idx)].text) {
          const oldText = state.entries[proj][Number(idx)].text;
          // Optimistic update
          state.entries[proj][Number(idx)].text = newText;
          render();
          const { error } = await sb.from('entries').update({ text: newText }).eq('id', id);
          if (error) { state.entries[proj][Number(idx)].text = oldText; render(); }
        } else {
          render();
        }
      }

      textEl.addEventListener('blur', saveEdit, { once: true });
      textEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); }
        if (e.key === 'Escape') { textEl.contentEditable = 'false'; render(); }
      }, { once: true });
    });
  });

  // Delete entry
  document.querySelectorAll('.delete-entry').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { id, proj } = btn.dataset;
      if (!confirm('确认删除这条记录？')) return;
      const oldEntries = [...state.entries[proj]];
      // Optimistic update
      state.entries[proj] = state.entries[proj].filter(e => e.id != id);
      render();
      const { error } = await sb.from('entries').delete().eq('id', id);
      if (error) { state.entries[proj] = oldEntries; render(); }
    });
  });
}

async function addEntry() {
  const proj = document.getElementById('project-select').value;
  const text = document.getElementById('entry-input').value.trim();
  if (!proj || !text) return;

  const ts = Date.now();
  const tempId = 'temp_' + ts;

  // Optimistic update
  if (!state.entries[proj]) state.entries[proj] = [];
  state.entries[proj].push({ id: tempId, text, status: 'todo', ts, origTs: ts });
  document.getElementById('entry-input').value = '';
  openCols.add(proj);
  render();
  const col = document.getElementById(`col-${proj}`);
  if (col) col.scrollTop = col.scrollHeight;

  // Sync to DB, replace temp id with real id
  const { data, error } = await sb.from('entries').insert({ project: proj, text, status: 'todo', ts, orig_ts: ts }).select().single();
  if (error) {
    state.entries[proj] = state.entries[proj].filter(e => e.id !== tempId);
    render();
  } else {
    const entry = state.entries[proj].find(e => e.id === tempId);
    if (entry) entry.id = data.id;
  }
}

    document.getElementById('overdue-modal').classList.remove('show');
});

function renderOverdueModal() {
  const OVERDUE_MS = 7 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  const content = document.getElementById('overdue-content');
  content.innerHTML = '';

  state.projects.forEach(proj => {
    const overdueItems = (state.entries[proj] || []).filter(
      e => e.status === 'todo' && (now - (e.origTs || e.ts)) > OVERDUE_MS
    );
    if (!overdueItems.length) return;

    const group = document.createElement('div');
    group.style.marginBottom = '12px';
    const title = document.createElement('div');
    title.className = 'overdue-proj-name';
    title.textContent = proj;
    group.appendChild(title);

    overdueItems.forEach(e => {
      const ageDays = Math.floor((now - (e.origTs || e.ts)) / 86400000);
      const item = document.createElement('div');
      item.className = 'overdue-item';
      item.innerHTML = `
        <div class="overdue-item-text">
          ${e.text}
          <div class="overdue-item-age">已超时 ${ageDays} 天</div>
        </div>
        <button class="overdue-done-btn" data-id="${e.id}" data-proj="${proj}">完成</button>
        <button class="overdue-del-btn" data-id="${e.id}" data-proj="${proj}">删除</button>
      `;
      group.appendChild(item);
    });
    content.appendChild(group);
  });

  if (!content.children.length) {
    content.innerHTML = '<div style="color:#aaa;font-size:13px;text-align:center;padding:12px 0">暂无超时任务</div>';
  }

  // 完成按钮
  content.querySelectorAll('.overdue-done-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { id, proj } = btn.dataset;
      const entry = state.entries[proj]?.find(e => e.id == id);
      if (!entry) return;
      const oldStatus = entry.status, oldTs = entry.ts;
      entry.status = 'done'; entry.ts = Date.now();
      render(); renderOverdueModal();
      const { error } = await sb.from('entries').update({ status: 'done', ts: entry.ts }).eq('id', id);
      if (error) { entry.status = oldStatus; entry.ts = oldTs; render(); renderOverdueModal(); }
    });
  });

  // 删除按钮
  content.querySelectorAll('.overdue-del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { id, proj } = btn.dataset;
      if (!confirm('确认删除这条超时任务？')) return;
      const oldEntries = [...state.entries[proj]];
      state.entries[proj] = state.entries[proj].filter(e => e.id != id);
      render(); renderOverdueModal();
      const { error } = await sb.from('entries').delete().eq('id', id);
      if (error) { state.entries[proj] = oldEntries; render(); renderOverdueModal(); }
    });
  });
}

// ── Calendar ──
let currentView = 'board';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let freqRange = 'week';

function buildDoneByDate() {
  const map = {};
  Object.entries(state.entries).forEach(([proj, entries]) => {
    entries.forEach(e => {
      if (e.status !== 'done') return;
      const d = new Date(e.ts);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (!map[key]) map[key] = [];
      map[key].push({ ...e, project: proj });
    });
  });
  return map;
}

function renderCalendar() {
  const doneByDate = buildDoneByDate();
  const today = new Date();

  // title
  document.getElementById('cal-title').textContent =
    `${calYear}年${calMonth + 1}月`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // day headers: Monday first
  ['一','二','三','四','五','六','日'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-day-header';
    h.textContent = d;
    grid.appendChild(h);
  });

  const firstDayRaw = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  // Convert to Monday-based offset: Mon=0 ... Sun=6
  const firstDay = (firstDayRaw + 6) % 7;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  // prev month padding
  for (let i = firstDay - 1; i >= 0; i--) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.innerHTML = `<div class="cal-date">${daysInPrev - i}</div>`;
    grid.appendChild(cell);
  }

  // current month days
  const isViewingCurrentMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const done = doneByDate[key] || [];
    // 只有查看当月时才高亮今日
    const isToday = isViewingCurrentMonth && today.getDate() === d;

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (done.length ? ' has-done' : '') + (isToday ? ' today' : '');

    const dateEl = document.createElement('div');
    dateEl.className = 'cal-date' + (isToday ? ' today-num' : '');
    dateEl.textContent = d;
    cell.appendChild(dateEl);

    if (done.length) {
      const cnt = document.createElement('div');
      cnt.className = 'cal-done-count';
      cnt.textContent = done.length;
      cell.appendChild(cnt);

      cell.addEventListener('click', () => showDayInfo(key, done));
    }
    grid.appendChild(cell);
  }

  // next month padding
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.innerHTML = `<div class="cal-date">${d}</div>`;
    grid.appendChild(cell);
  }

  renderCalendarFreq();
}

function renderCalendarFreq() {
  // 切换月份时：重置当日面板，根据当月是否有完成任务决定显示内容
  const panel = document.getElementById('day-info-panel');
  panel.classList.remove('show');

  const doneByDate = buildDoneByDate();
  const prefix = `${calYear}-${String(calMonth+1).padStart(2,'0')}-`;
  const monthHasDone = Object.keys(doneByDate).some(k => k.startsWith(prefix));

  const emptyHint = document.getElementById('freq-empty-hint');
  const freqTitle = document.querySelector('.freq-section .freq-title');
  const freqTabs = document.querySelector('.freq-tabs');
  const freqChartArea = document.getElementById('freq-chart-area');
  const freqLegend = document.getElementById('freq-legend');

  if (!monthHasDone) {
    emptyHint.textContent = `${calYear}年${calMonth+1}月暂无已完成的任务`;
    emptyHint.style.display = 'block';
    freqTitle.style.display = 'none';
    freqTabs.style.display = 'none';
    freqChartArea.innerHTML = '';
    freqLegend.innerHTML = '';
  } else {
    emptyHint.style.display = 'none';
    freqTitle.style.display = '';
    freqTabs.style.display = '';
    // 折线图基准设为当月第一天（非今日）
    freqBaseDate = `${prefix}01`;
    // 强制切换到月视图展示当月趋势
    freqRange = 'month';
    document.querySelectorAll('.freq-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.range === 'month');
    });
    renderFreqChart();
  }
}

let currentDayEntries = [];

function showDayInfo(dateKey, entries) {
  const [y, m, d] = dateKey.split('-');
  const panel = document.getElementById('day-info-panel');
  document.getElementById('day-info-title').textContent = `${y}年${Number(m)}月${Number(d)}日 完成情况`;

  // 扇形图：按项目统计
  const totals = {};
  entries.forEach(e => { totals[e.project] = (totals[e.project] || 0) + 1; });
  const projects = Object.keys(totals);
  drawPieChart(projects, totals, document.getElementById('day-info-pie'));

  // 最多完成项目
  const topProj = projects.reduce((a, b) => totals[a] >= totals[b] ? a : b, projects[0]);
  const topEl = document.getElementById('day-info-top');
  if (topProj) {
    topEl.textContent = `本日完成最多：${topProj}，${totals[topProj]}次`;
    topEl.style.display = '';
  } else {
    topEl.style.display = 'none';
  }

  currentDayEntries = entries;
  document.getElementById('day-detail-btn').dataset.dateKey = dateKey;
  panel.classList.add('show');

  // 折线图跟随点击日期所在周/月，同时恢复趋势区显示
  const emptyHint = document.getElementById('freq-empty-hint');
  const freqTitle = document.querySelector('.freq-section .freq-title');
  const freqTabs = document.querySelector('.freq-tabs');
  emptyHint.style.display = 'none';
  freqTitle.style.display = '';
  freqTabs.style.display = '';
  freqBaseDate = dateKey;
  renderFreqChart();

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function showDayModal(dateKey, entries) {
  const [y, m, d] = dateKey.split('-');
  document.getElementById('day-modal-title').textContent = `${y}年${Number(m)}月${Number(d)}日 完成任务`;

  const byProj = {};
  entries.forEach(e => {
    if (!byProj[e.project]) byProj[e.project] = [];
    byProj[e.project].push(e);
  });

  const content = document.getElementById('day-modal-content');
  content.innerHTML = Object.entries(byProj).map(([proj, items]) => `
    <div class="day-proj-group">
      <div class="day-proj-name">${proj}</div>
      ${items.map(e => `
        <div class="day-entry-item">
          ${e.text}
          <div class="day-entry-time">${formatTime(e.ts)}</div>
        </div>`).join('')}
    </div>`).join('');

  document.getElementById('day-modal').classList.add('show');
}

// Palette for projects (cycles if more than 8)
const PROJ_COLORS = ['#4f8ef7','#f7874f','#4fc97a','#f7c94f','#c44ff7','#f74f7a','#4fd4f7','#a0a0a0'];

function getProjColor(idx) { return PROJ_COLORS[idx % PROJ_COLORS.length]; }

function buildPeriodTotals(projects, doneByDate, rangeFilter) {
  // rangeFilter: function(dateKey) => bool
  const totals = {};
  projects.forEach(p => { totals[p] = 0; });
  Object.entries(doneByDate).forEach(([key, items]) => {
    if (!rangeFilter(key)) return;
    items.forEach(e => { if (totals[e.project] !== undefined) totals[e.project]++; });
  });
  return totals;
}

function drawPieChart(projects, totals, container) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const grandTotal = Object.values(totals).reduce((a, b) => a + b, 0);
  if (grandTotal === 0) {
    container.innerHTML = '<div style="color:#aaa;font-size:12px;text-align:center;padding:12px 0">暂无完成记录</div>';
    return;
  }

  // 找出有数据的项目，并用 state.projects 顺序确定颜色索引
  const activeProjs = projects.filter(p => totals[p] > 0);
  const getColor = p => {
    const idx = state.projects.indexOf(p);
    return getProjColor(idx >= 0 ? idx : activeProjs.indexOf(p));
  };

  const R = 60, CX = 70, CY = 70;
  const legendX = 148;
  const svgH = Math.max(140, activeProjs.length * 20 + 20);
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('viewBox', `0 0 300 ${svgH}`);
  svg.setAttribute('style', 'display:block');

  if (activeProjs.length === 1) {
    // 单项目：画整圆
    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('cx', CX); circle.setAttribute('cy', CY);
    circle.setAttribute('r', R); circle.setAttribute('fill', getColor(activeProjs[0]));
    svg.appendChild(circle);
  } else {
    let startAngle = -Math.PI / 2;
    activeProjs.forEach(p => {
      const count = totals[p];
      const angle = (count / grandTotal) * 2 * Math.PI;
      const endAngle = startAngle + angle;
      const x1 = CX + R * Math.cos(startAngle);
      const y1 = CY + R * Math.sin(startAngle);
      const x2 = CX + R * Math.cos(endAngle);
      const y2 = CY + R * Math.sin(endAngle);
      const largeArc = angle > Math.PI ? 1 : 0;
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', `M${CX},${CY} L${x1},${y1} A${R},${R} 0 ${largeArc},1 ${x2},${y2} Z`);
      path.setAttribute('fill', getColor(p));
      svg.appendChild(path);
      startAngle = endAngle;
    });
  }

  // 图例
  activeProjs.forEach((p, li) => {
    const count = totals[p];
    const ly = 16 + li * 20;
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', legendX); rect.setAttribute('y', ly - 9);
    rect.setAttribute('width', 12); rect.setAttribute('height', 12);
    rect.setAttribute('rx', 2); rect.setAttribute('fill', getColor(p));
    svg.appendChild(rect);
    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', legendX + 16); txt.setAttribute('y', ly);
    txt.setAttribute('font-size', '11'); txt.setAttribute('fill', '#333');
    txt.textContent = `${p}  ${count}次 (${Math.round(count / grandTotal * 100)}%)`;
    svg.appendChild(txt);
  });

  container.innerHTML = '';
  container.appendChild(svg);
}

let freqBaseDate = null; // null = 今天

function renderFreqChart() {
  const projects = state.projects;
  const doneByDate = buildDoneByDate();
  const lineArea = document.getElementById('freq-chart-area');
  const legendArea = document.getElementById('freq-legend');
  const base = freqBaseDate ? new Date(freqBaseDate) : new Date();

  const labels = [];
  const projData = {};
  projects.forEach(p => { projData[p] = []; });

  if (freqRange === 'week') {
    const dow = (base.getDay() + 6) % 7;
    const weekStart = new Date(base); weekStart.setDate(base.getDate() - dow); weekStart.setHours(0,0,0,0);
    for (let d = 0; d < 7; d++) {
      const day = new Date(weekStart); day.setDate(weekStart.getDate() + d);
      const key = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
      labels.push(['一','二','三','四','五','六','日'][d]);
      const entries = doneByDate[key] || [];
      projects.forEach(p => projData[p].push(entries.filter(e => e.project === p).length));
    }
  } else {
    const daysInMonth = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
    const prefix = `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-`;
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${prefix}${String(d).padStart(2,'0')}`;
      labels.push(String(d));
      const entries = doneByDate[key] || [];
      projects.forEach(p => projData[p].push(entries.filter(e => e.project === p).length));
    }
  }

  drawLineChart(labels, projects, projData, lineArea);
  drawLegend(projects, legendArea);
}

function drawLegend(projects, container) {
  container.innerHTML = '';
  container.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;';
  projects.forEach((p, i) => {
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;align-items:center;gap:4px;font-size:11px;color:#555;';
    item.innerHTML = `<span style="display:inline-block;width:12px;height:3px;border-radius:2px;background:${getProjColor(i)}"></span>${p}`;
    container.appendChild(item);
  });
}

function drawLineChart(labels, projects, projData, container) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const W = container.clientWidth || 320;
  const H = 100;
  const n = labels.length;
  const allCounts = Object.values(projData).flat();
  const maxVal = Math.max(...allCounts, 1);
  const padL = 20, padR = 8, padT = 8, padB = 22;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Baseline
  const base = document.createElementNS(svgNS, 'line');
  base.setAttribute('x1', padL); base.setAttribute('y1', padT + chartH);
  base.setAttribute('x2', padL + chartW); base.setAttribute('y2', padT + chartH);
  base.setAttribute('stroke', '#e0e0e0'); base.setAttribute('stroke-width', '1');
  svg.appendChild(base);

  // X labels (show every nth to avoid crowding)
  const step = n <= 12 ? 1 : Math.ceil(n / 12);
  labels.forEach((lbl, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    const x = padL + (i / (n - 1 || 1)) * chartW;
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', H - 4);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '8'); t.setAttribute('fill', '#aaa');
    t.textContent = lbl;
    svg.appendChild(t);
  });

  // Lines per project
  projects.forEach((p, pi) => {
    const counts = projData[p];
    const hasAny = counts.some(c => c > 0);
    if (!hasAny) return;
    const color = getProjColor(pi);
    let d = '';
    counts.forEach((c, i) => {
      const x = padL + (i / (n - 1 || 1)) * chartW;
      const y = padT + chartH - (c / maxVal) * chartH;
      d += (i === 0 ? 'M' : 'L') + `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);

    // Dots for non-zero points
    counts.forEach((c, i) => {
      if (c === 0) return;
      const x = padL + (i / (n - 1 || 1)) * chartW;
      const y = padT + chartH - (c / maxVal) * chartH;
      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', x); circle.setAttribute('cy', y);
      circle.setAttribute('r', '2.5'); circle.setAttribute('fill', color);
      svg.appendChild(circle);
    });
  });

  container.innerHTML = '';
  container.appendChild(svg);
}

document.getElementById('cal-toggle-btn').addEventListener('click', () => {
  currentView = currentView === 'board' ? 'calendar' : 'board';
  document.getElementById('board').classList.toggle('hidden', currentView === 'calendar');
  document.getElementById('calendar-view').classList.toggle('active', currentView === 'calendar');
  document.querySelector('footer').style.display = currentView === 'calendar' ? 'none' : '';
  document.getElementById('cal-toggle-btn').textContent = currentView === 'calendar' ? '📋 看板' : '📅 日历';
  if (currentView === 'calendar') renderCalendar();
});

document.getElementById('cal-prev').addEventListener('click', () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

document.querySelectorAll('.freq-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    freqRange = tab.dataset.range;
    document.querySelectorAll('.freq-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderFreqChart();
  });
});

document.getElementById('day-detail-btn').addEventListener('click', () => {
  showDayModal(document.getElementById('day-detail-btn').dataset.dateKey, currentDayEntries);
});
document.getElementById('day-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('day-modal'))
    document.getElementById('day-modal').classList.remove('show');
});

document.getElementById('overdue-btn').addEventListener('click', () => {
  renderOverdueModal();
  document.getElementById('overdue-modal').classList.add('show');
});
